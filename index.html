["💰","Aritmetika","Mata uang, bank, dan benda-benda pos"],

const M1_MATERI=`
<div class="note">📌 Tab ini berisi <b>Kegiatan Belajar 1 (Garis, Sudut, dan Kurva)</b>. Materi KB 2 ada di tab sebelahnya.</div>

<div class="sec"><h2>🎯 Gambaran Modul 1</h2>
<p>Bangun datar adalah bekal dasar untuk belajar bangun ruang. Saat mempelajari balok atau kubus, kita memakai titik, garis, ruas garis, sudut, persegi panjang, dan persegi. Contoh bangun datar sehari-hari: kusen pintu kelas dan tepi papan tulis.</p>
<p>Modul ini dibagi dua. Kegiatan Belajar 1 membahas garis, sudut, dan kurva. Kegiatan Belajar 2 membahas segibanyak, lingkaran, dan tangram.</p>
<div class="tw"><table><tr><th>Kompetensi khusus (ringkas)</th></tr>
<tr><td>Menjelaskan garis, sudut, kurva, segibanyak, lingkaran, dan tangram beserta sifatnya</td></tr>
<tr><td>Menyelesaikan soal tentangnya dan menjelaskan salah konsep dari sisi guru dan siswa</td></tr>
<tr><td>Membelajarkannya ke siswa SD dengan media dan pendekatan yang tepat</td></tr>
<tr><td>Mengevaluasi hasil belajar siswa</td></tr></table></div>
<p>Alat yang disarankan: penggaris, jangka, pensil, kertas. Belajar kelompok 3 sampai 4 orang.</p></div>

<div class="sec"><h2>1️⃣ Titik</h2>
<p>Titik adalah ide dasar geometri dan <b>tidak didefinisikan</b>. Bayangkan ujung pensil, ujung paku, ujung jarum, atau noktah kota Malang di peta Jawa. Itu hanya gambaran kasar. Titik yang sebenarnya <b>tidak punya ukuran</b>: tidak punya panjang, tebal, ataupun lebar. Titik hanya menunjuk <b>posisi atau letak</b>.</p>
<p>Titik digambar dengan noktah dan diberi nama huruf kapital: titik A, titik B, titik C. Gambar seperti ini disebut <b>model geometri</b>, yaitu alat bantu untuk memahami ide geometri yang abstrak.</p>
<p>Himpunan semua titik membentuk <b>ruang</b>. Ruang itu penuh dengan titik, mirip ruang kelas yang tidak punya sudut kosong.</p>
<div class="ingat">🧠 <b>Ingat:</b> titik itu seperti "alamat" tanpa ukuran. Alamat menunjukkan tempat, tetapi alamat sendiri tidak punya besar.</div></div>

<div class="sec"><h2>2️⃣ Bidang</h2>
<p>Bidang adalah himpunan titik yang sangat luas. Panjang dan lebarnya tak terhingga, tetapi <b>tidak punya tebal</b>. Bayangkan permukaan kaca yang rata, meja tulis, papan tulis, atau tembok kelas. Bidang yang terbatas bisa dibayangkan seperti selembar kertas di buku tulis.</p>
<p>Model bidang digambar sebagai daerah jajar genjang. Penamaan: satu huruf kapital di pojok (bidang H), atau empat huruf kapital di keempat pojok (bidang ABCD).</p>
<p>Empat titik berlainan yang tidak terletak pada satu garis menentukan satu bidang.</p>
<div class="tw"><table><tr><th>Dua bidang</th><th>Ciri</th><th>Contoh</th></tr>
<tr><td>Sejajar</td><td>Tidak punya satu pun titik persekutuan</td><td>Lantai dan langit-langit kelas</td></tr>
<tr><td>Berpotongan</td><td>Perpotongannya berupa <b>garis lurus</b></td><td>Lantai dan tembok kelas</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> dua bidang berpotongan menghasilkan garis. Lantai bertemu tembok, di pertemuannya terbentuk garis sudut ruangan.</div></div>

<div class="sec"><h2>3️⃣ Garis</h2>
<p>Garis lurus adalah himpunan titik, merupakan himpunan bagian dari bidang. Panjangnya tak terhingga, dapat diperpanjang ke kedua arah, dan tidak punya tebal. Pada gambar, anak panah di kedua ujung menandakan garis bisa diperpanjang.</p>
<p>Penamaan: satu huruf kecil (garis g) atau dua huruf kapital dari dua titik berlainan pada garis (garis PQ). <b>Garis ditentukan oleh dua titik berlainan.</b> Contoh: tepi papan tulis, tepi meja, garis pinggir lapangan voli atau tenis.</p>
<h3>Hubungan dua garis</h3>
<div class="tw"><table><tr><th>Jenis</th><th>Ciri</th><th>Menentukan bidang?</th></tr>
<tr><td>Sejajar</td><td>Terletak pada satu bidang dan tidak punya titik persekutuan</td><td>Ya, satu bidang</td></tr>
<tr><td>Berpotongan</td><td>Punya tepat satu titik persekutuan</td><td>Ya, satu bidang</td></tr>
<tr><td>Bersilangan</td><td>Tidak terletak pada satu bidang dan tidak punya titik sekutu</td><td>Tidak</td></tr></table></div>
<h3>Contoh pada balok ABCD.EFGH</h3>
<div class="tw"><table><tr><th>Hubungan</th><th>Pasangan garis</th></tr>
<tr><td>Sejajar</td><td>AE dan BF, BC dan AD, EH dan FG</td></tr>
<tr><td>Berpotongan</td><td>AB dan AE, CG dan GH, EH dan HG</td></tr>
<tr><td>Bersilangan</td><td>AE dan BC, AB dan FG</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> sejajar dan berpotongan sama-sama "satu bidang". Bersilangan berbeda: seperti jalan layang dan jalan di bawahnya, tidak bertemu dan tidak sebidang.</div></div>

<div class="sec"><h2>4️⃣ Ruas Garis</h2>
<p>Ruas garis adalah bagian dari garis. Pilih dua titik berlainan P dan Q pada garis g. Himpunan titik P, titik Q, dan semua titik di antaranya membentuk <b>ruas garis PQ</b>. Ruas garis <b>punya ukuran</b>, disebut panjang PQ. Contoh: sisi papan tulis, sisi meja, tali 2 m yang direnggangkan.</p>
<div class="ingat">🧠 <b>Ingat:</b> garis tak terbatas, ruas garis terpotong di dua ujung. Garis seperti rel kereta yang tak berujung, ruas garis seperti satu batang rel yang sudah dipotong.</div></div>

<div class="sec"><h2>5️⃣ Sinar Garis</h2><div class="il"><svg viewBox="0 0 360 140" role="img"><g class="s"><line x1="22" y1="25" x2="338" y2="25"/><line x1="100" y1="70" x2="260" y2="70"/><line x1="100" y1="115" x2="338" y2="115"/></g><polygon class="p" points="12,25 26,19 26,31"/><polygon class="p" points="348,25 334,19 334,31"/><polygon class="p" points="348,115 334,109 334,121"/><circle class="p" cx="100" cy="70" r="3.5"/><circle class="p" cx="260" cy="70" r="3.5"/><circle class="p" cx="100" cy="115" r="3.5"/><text x="180" y="15">garis g (tak berujung)</text><text x="92" y="88">P</text><text x="256" y="88">Q</text><text x="150" y="62">ruas garis PQ (punya panjang)</text><text x="92" y="132">A</text><text x="150" y="107">sinar AB (pangkal di A)</text></svg><small>Garis, ruas garis, dan sinar garis</small></div>
<p>Satu titik A pada garis g membagi garis menjadi dua bagian. Masing-masing bagian disebut <b>tengahan garis</b>, dan titik A <b>tidak termasuk</b> tengahan garis. Gabungan titik A dan semua titik pada salah satu tengahan disebut <b>sinar garis</b>.</p>
<p>Pada sinar garis AB, titik A adalah <b>titik pangkal</b> dan B sebarang titik pada sinar. Penulisan urutan penting: <b>sinar AB tidak sama dengan sinar BA</b>, dan sinar AC tidak sama dengan sinar CA. Contoh: cahaya lampu senter atau lampu motor, titik pangkalnya di "dop" lampu.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Ujung</th><th>Punya ukuran?</th></tr>
<tr><td>Garis</td><td>Tidak berujung (dua arah)</td><td>Tidak</td></tr>
<tr><td>Ruas garis</td><td>Dua ujung</td><td>Ya (panjang)</td></tr>
<tr><td>Sinar garis</td><td>Satu titik pangkal, satu arah tak terbatas</td><td>Tidak</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> huruf pertama pada nama sinar adalah pangkalnya. Seperti senter: nyala dimulai dari lampu, lalu menyebar ke satu arah.</div></div>

<div class="sec"><h2>6️⃣ Sudut</h2><div class="il"><svg viewBox="0 0 400 112" role="img"><g class="s"><polyline points="80,85 20,85 70,55"/><polyline points="170,85 110,85 110,25"/><rect x="110" y="73" width="12" height="12"/><polyline points="290,85 230,85 200,50"/><line x1="310" y1="85" x2="390" y2="85"/></g><circle class="p" cx="20" cy="85" r="3"/><circle class="p" cx="110" cy="85" r="3"/><circle class="p" cx="230" cy="85" r="3"/><circle class="p" cx="350" cy="85" r="3"/><text x="22" y="104">lancip &lt;90°</text><text x="108" y="104">siku-siku 90°</text><text x="205" y="104">tumpul &gt;90°</text><text x="318" y="104">lurus 180°</text></svg><small>Empat jenis sudut (titik pink = titik sudut)</small></div>
<p>Sudut adalah gabungan dua sinar garis (misalnya sinar AB dan sinar AC) yang berpangkal sama. Kedua sinar disebut <b>kaki sudut</b>, titik pangkalnya adalah titik sudut.</p>
<h3>Cara menamai</h3>
<p>Bisa dengan satu huruf kapital (sudut A) atau tiga huruf kapital (sudut BAC atau CAB). Jika ada lebih dari satu sudut pada gambar, pakai tiga huruf supaya tidak rancu, dengan <b>titik sudut selalu di tengah</b>. Contoh: sudut QPR, QPS, RPS.</p>
<p>Contoh sehari-hari: pigura kayu persegi panjang (4 sudut), tegel lantai (4 sudut), eternit (4 sudut), penggaris segitiga (3 sudut).</p>
<h3>Ukuran sudut</h3>
<p>Satuannya derajat. Sudut pusat lingkaran dibagi 360 bagian sama besar, tiap bagian 1 derajat. Busur derajat berbentuk setengah lingkaran yang dibagi 180 bagian sama besar.</p>
<h3>Jenis sudut</h3>
<div class="tw"><table><tr><th>Jenis</th><th>Besar</th><th>Catatan</th></tr>
<tr><td>Sudut lancip</td><td>kurang dari 90°</td><td></td></tr>
<tr><td>Sudut siku-siku</td><td>tepat 90°</td><td>Kakinya saling tegak lurus</td></tr>
<tr><td>Sudut tumpul</td><td>lebih dari 90° dan kurang dari 180°</td><td></td></tr>
<tr><td>Sudut lurus</td><td>tepat 180°</td><td>Berupa garis lurus</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> lancip = "lancip seperti ujung pensil, kecil". Urutan dari kecil ke besar: <b>lancip, siku-siku, tumpul, lurus</b> (0 sampai 180).</div></div>

<div class="sec"><h2>7️⃣ Kurva</h2><div class="il"><svg viewBox="0 0 400 114" role="img"><g class="s"><ellipse cx="55" cy="45" rx="38" ry="26"/><polygon points="125,25 195,65 195,25 125,65"/><path d="M225,62 C245,15 265,90 292,35"/><path d="M320,28 L378,68 L378,33 L338,58"/></g><circle class="p" cx="225" cy="62" r="3"/><circle class="p" cx="292" cy="35" r="3"/><circle class="p" cx="320" cy="28" r="3"/><circle class="p" cx="338" cy="58" r="3"/><text x="18" y="92">tertutup</text><text x="18" y="104">sederhana</text><text x="122" y="92">tertutup</text><text x="122" y="104">tidak sederhana</text><text x="222" y="92">tidak tertutup</text><text x="222" y="104">sederhana</text><text x="316" y="92">tidak tertutup</text><text x="316" y="104">tidak sederhana</text></svg><small>Empat jenis kurva (titik pink = titik ujung)</small></div>
<p>Kurva adalah kumpulan titik pada bidang datar, termasuk bangun geometri datar. Garis, ruas garis, sinar garis, dan sudut semuanya adalah contoh kurva.</p>
<h3>Cara mengenalkan ke siswa</h3>
<p>Siswa menggambar titik A (titik pangkal), meletakkan ujung pensil di A, lalu tanpa mengangkat pensil menggambar gabungan lengkungan, garis, ruas garis, atau sinar sesukanya hingga berakhir di titik B (titik ujung). Hasil gambar itulah kurva. Cara lain: membentuk kurva dengan tali rafia atau benang sepanjang kira-kira 50 cm di atas meja, lalu guru bertanya apakah kurvanya tertutup atau tidak, dan sederhana atau tidak, sambil meminta alasan.</p>
<h3>Jenis kurva</h3>
<div class="tw"><table><tr><th>Jenis</th><th>Ciri</th><th>Contoh</th></tr>
<tr><td>Kurva tertutup sederhana</td><td>Titik ujung B berimpit dengan titik pangkal A, tidak memotong dirinya sendiri</td><td>Lingkaran, elips, segitiga, segi empat</td></tr>
<tr><td>Kurva tertutup tidak sederhana</td><td>Tertutup, tetapi memotong dirinya sendiri (punya titik potong)</td><td>Bentuk angka 8</td></tr>
<tr><td>Kurva tidak tertutup sederhana</td><td>Titik A dan B tidak berimpit, tidak memotong dirinya</td><td>Garis lurus, ruas garis, sinar garis, sudut</td></tr>
<tr><td>Kurva tidak tertutup tidak sederhana</td><td>Titik A dan B tidak berimpit, memotong dirinya</td><td>Lengkungan yang menyilang</td></tr></table></div>
<p><b>Segibanyak</b> adalah kurva tertutup sederhana yang hanya dibentuk oleh ruas-ruas garis. Pada kurva tertutup, titik pangkal dan ujung menjadi kabur, maka kurva tertutup dikatakan <b>tidak mempunyai ujung</b>. Hanya kurva tidak tertutup yang punya titik ujung.</p>
<div class="ingat">🧠 <b>Ingat:</b> dua pertanyaan penentu: (1) <i>Ujungnya bertemu?</i> kalau ya, tertutup. (2) <i>Memotong dirinya?</i> kalau tidak, sederhana. Seperti tali sepatu: simpul tertutup yang tidak menyilang itu rapi (sederhana).</div></div>

<div class="sec"><h2>8️⃣ Daerah Dalam, Daerah Luar, Konveks dan Konkav</h2><div class="il"><svg viewBox="0 0 360 120" role="img"><polygon class="f" points="20,20 140,20 140,90 20,90"/><line class="h" x1="40" y1="35" x2="120" y2="75"/><polygon class="f" points="200,95 200,25 240,25 270,62 300,25 340,25 340,95"/><line class="h" x1="222" y1="35" x2="318" y2="35"/><text x="50" y="108">konveks (cembung)</text><text x="215" y="110">konkav (cekung)</text></svg><small>Ruas garis pink: seluruhnya di dalam (konveks) atau keluar sebagian (konkav)</small></div>
<p>Kurva tertutup sederhana membagi titik-titik pada bidang menjadi dua daerah terpisah: <b>daerah dalam (interior)</b> dan <b>daerah luar (eksterior)</b>. Titik pada kurva sendiri bukan bagian keduanya. Contoh untuk siswa: halaman sekolah yang berpagar. Bermain di dalam pagar berarti di interior, di luar pagar berarti eksterior.</p>
<h3>Konveks dan konkav</h3>
<div class="tw"><table><tr><th>Daerah</th><th>Ciri</th></tr>
<tr><td>Konveks (cembung)</td><td>Ruas garis yang menghubungkan dua titik mana pun di daerah dalam <b>seluruhnya</b> terletak di daerah dalam. Contoh: segi empat ABCD</td></tr>
<tr><td>Konkav (cekung, tidak konveks)</td><td>Ada ruas garis dengan kedua ujung di daerah dalam, tetapi sebagian titiknya jatuh di daerah luar. Contoh: segi lima PQRST (ruas UV, titik antara E dan F di luar)</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> konveks = "tidak ada lekukan ke dalam", seperti roti bulat. Konkav = "ada gua", seperti huruf C atau bulan sabit.</div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 1)</h2><div class="ujian">
<p>🔸 Dua garis <b>bersilangan</b> tidak sebidang dan tidak bertemu. Dua garis <b>sejajar</b> sebidang dan tidak bertemu. Jangan tertukar.<br>
🔸 Sinar AB ≠ sinar BA. Huruf pertama adalah titik pangkal.<br>
🔸 Banyak sudut dari n sinar yang berpangkal sama: setiap pasang sinar membentuk satu sudut. 4 sinar menghasilkan 6 sudut (AOB, AOC, AOD, BOC, BOD, COD).<br>
🔸 Sudut lancip kurang dari 90°. Pilihan "lebih dari 90°" adalah sudut tumpul.<br>
🔸 Kurva tertutup tidak sederhana = tertutup dan memotong dirinya. Jangan tertukar dengan kurva tidak tertutup.<br>
🔸 Titik tidak punya ukuran. Ruas garis punya ukuran (panjang). Garis tidak punya panjang tertentu.<br>
🔸 Perpotongan dua bidang adalah garis, bukan titik.<br>
🔸 Penamaan sudut dengan tiga huruf: titik sudut di tengah.<br>
🔸 Kurva tertutup tidak punya titik ujung.</p></div></div>

<div class="note">📌 <b>Kegiatan Belajar 2: Segibanyak, Lingkaran, dan Tangram.</b></div>

<div class="sec"><h2>1️⃣ Segibanyak</h2>
<p>Segibanyak adalah <b>kurva sederhana tertutup</b> yang dibentuk oleh segmen-segmen garis. Segmen garis pembentuknya disebut <b>sisi</b>. Segibanyak punya <b>paling sedikit tiga sisi</b>. Nama mengikuti banyak sisi:</p>
<div class="tw"><table><tr><th>Banyak sisi</th><th>Nama</th></tr><tr><td>3</td><td>Segitiga</td></tr><tr><td>4</td><td>Segi empat</td></tr><tr><td>5</td><td>Segilima</td></tr><tr><td>6</td><td>Segienam, dan seterusnya</td></tr></table></div>
<p>Jika semua sisinya sama panjang <b>dan</b> semua sudutnya sama besar, namanya <b>segibanyak beraturan</b>.</p>
<p>Bangun datar yang <b>bukan segibanyak</b> adalah yang tidak hanya dibentuk oleh segmen garis, tetapi juga oleh kurva (lengkungan). Lingkaran dan elips termasuk bukan segibanyak.</p>
<div class="ingat">🧠 <b>Ingat:</b> segibanyak = "lurus semua". Ada satu sisi melengkung saja, gugurlah ia dari daftar segibanyak.</div></div>

<div class="sec"><h2>2️⃣ Segitiga</h2>
<p>Segitiga adalah segibanyak paling dasar, bersisi tiga. Pembedaannya menurut sisi atau sudutnya.</p>
<div class="tw"><table><tr><th>Jenis</th><th>Ciri</th></tr>
<tr><td>Segitiga sama kaki</td><td>Dua atau tiga sisinya sama panjang</td></tr>
<tr><td>Segitiga sama sisi</td><td>Ketiga sisinya sama panjang (sudut-sudutnya juga sama besar)</td></tr>
<tr><td>Segitiga tidak sama kaki dan tidak sama sisi</td><td>Ketiga sisinya berbeda panjang</td></tr>
<tr><td>Segitiga siku-siku</td><td>Punya satu sudut siku-siku (90°)</td></tr></table></div>
<p>Karena sama kaki berarti "dua atau tiga sisi sama", maka <b>segitiga sama sisi juga termasuk sama kaki</b>.</p>
<div class="ingat">🧠 <b>Ingat:</b> sama sisi adalah "kasus istimewa" dari sama kaki, bukan sebaliknya. Semua sama sisi itu sama kaki, tetapi tidak semua sama kaki itu sama sisi.</div></div>

<div class="sec"><h2>3️⃣ Segi Empat</h2><div class="il"><svg viewBox="0 0 400 158" role="img"><rect class="f" x="30" y="10" width="50" height="50"/><rect class="f" x="160" y="15" width="80" height="40"/><polygon class="f" points="290,55 360,55 385,15 315,15"/><polygon class="f" points="55,85 85,108 55,142 25,108"/><polygon class="f" points="200,85 232,113 200,141 168,113"/><polygon class="f" points="300,142 390,142 365,100 325,100"/><text x="35" y="75">persegi</text><text x="165" y="75">persegi panjang</text><text x="298" y="75">jajar genjang</text><text x="20" y="154">layang-layang</text><text x="168" y="154">belah ketupat</text><text x="320" y="154">trapesium</text></svg><small>Enam macam segi empat</small></div>
<p>Segi empat adalah segibanyak yang paling banyak macamnya: persegi, persegi panjang, jajar genjang, layang-layang, belah ketupat, dan trapesium. Untuk membedakannya, lihat tiga hal: (1) sisi berhadapan sejajar atau tidak, (2) sudutnya siku-siku atau tidak, (3) sisinya sama panjang atau tidak.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Sifat</th></tr>
<tr><td>Persegi</td><td>Sisi berhadapan sejajar, keempat sudut siku-siku, keempat sisi sama panjang</td></tr>
<tr><td>Persegi panjang</td><td>Keempat sudutnya siku-siku</td></tr>
<tr><td>Jajar genjang</td><td>Dua pasang sisi berhadapan sejajar (dan sama panjang)</td></tr>
<tr><td>Layang-layang</td><td>Dua pasang sisi berdekatan masing-masing sama panjang</td></tr>
<tr><td>Trapesium</td><td>Tepat satu pasang sisi sejajar</td></tr></table></div>
<p>Contoh benda sehari-hari: buku, pintu, jendela, kotak, muka papan tulis, daun meja, muka bangku, tembok kelas.</p>
<div class="ingat">🧠 <b>Ingat:</b> trapesium = <b>satu</b> pasang sejajar, jajar genjang = <b>dua</b> pasang. Layang-layang: sisi yang <b>berdekatan</b> sama, bukan yang berhadapan.</div></div>

<div class="sec"><h2>4️⃣ Lingkaran</h2><div class="il"><svg viewBox="0 0 260 130" role="img"><circle class="f" cx="130" cy="65" r="50"/><line class="h" x1="95" y1="30" x2="165" y2="100"/><line class="s" x1="130" y1="65" x2="180" y2="65"/><circle class="p" cx="130" cy="65" r="3.5"/><text x="120" y="58">O</text><text x="152" y="60">r</text><text x="82" y="26">diameter d = 2r</text><text x="188" y="69">jari-jari</text></svg><small>Pusat O, jari-jari r, dan diameter d</small></div>
<p>Contoh di sekitar kita: matahari, permukaan pil, roda kendaraan. Jika sisi segibanyak beraturan diperbanyak menjadi segi-n dengan n sangat besar, semua titiknya berjarak sama dari satu titik pusat. Dari sini lingkaran didefinisikan.</p>
<p><b>Lingkaran</b> adalah kurva sederhana tertutup selain segibanyak, yaitu himpunan titik-titik pada bidang yang <b>berjarak sama dari suatu titik tertentu</b> (titik tetap) pada bidang itu.</p>
<div class="tw"><table><tr><th>Istilah</th><th>Arti</th></tr>
<tr><td>Pusat</td><td>Titik tetap tempat jarak diukur</td></tr>
<tr><td>Jari-jari (r)</td><td>Segmen garis dari pusat ke titik pada lingkaran</td></tr>
<tr><td>Diameter</td><td>Segmen garis yang melalui pusat, ujungnya pada lingkaran, panjangnya dua kali jari-jari</td></tr></table></div>
<h3>Peragaan untuk siswa</h3>
<p>(1) Ikat tali pada tonggak, tegangkan, lalu berjalan mengelilingi tonggak. Tonggak sebagai pusat, panjang tali sebagai jari-jari. (2) Ikat batu pada tali lalu putar. Tangan sebagai pusat. Tali lebih panjang menghasilkan lingkaran lebih besar.</p>
<p><b>Bukan lingkaran:</b> sinar lampu senter yang diarahkan agak miring ke dinding, dan lintasan bumi mengelilingi matahari.</p>
<div class="ingat">🧠 <b>Ingat:</b> kata kuncinya <b>"jarak sama dari satu titik tetap"</b>. Diameter = 2 × jari-jari.</div></div>

<div class="sec"><h2>5️⃣ Tangram</h2>
<p>Tangram adalah permainan orang Cina kuno ribuan tahun lalu. Penemunya tidak diketahui pasti, tetapi dikenal di seluruh dunia. Tangram adalah <b>himpunan tujuh bangun datar yang dapat dipotong dari suatu persegi</b>. Contoh susunannya: lima segitiga, satu persegi, dan satu jajaran genjang. Potongan-potongan inilah yang disebut potongan tangram.</p>
<h3>Tangram mini untuk siswa</h3>
<p>Buat persegi berukuran 10 cm dari kertas agak tebal. Potong menjadi lima potongan (mengurangi dua segitiga besar), beri nama a, b, c, d, e, dan buat dua perangkat atau lebih. Dari lima potongan dapat disusun persegi panjang, jajaran genjang, dan trapesium. Setelah siswa terlatih, tambah menjadi tujuh potongan untuk menyusun bangun yang lebih banyak.</p>
<h3>Luas dan keliling</h3>
<p>Luas gabungan potongan tangram <b>sama</b> dengan luas persegi awal. Keliling potongan tangram <b>belum tentu sama</b> dengan keliling persegi awal, tergantung bentuk gabungannya. Dari potongan tangram tidak mungkin dibuat layang-layang atau belah ketupat.</p>
<div class="ingat">🧠 <b>Ingat:</b> luas tetap (bahan kertasnya sama), keliling bisa berubah (bentuk berubah, tepi luarnya berubah).</div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 2)</h2><div class="ujian"><p>
🔸 Bangun yang ada sisi melengkungnya <b>bukan segibanyak</b>.<br>
🔸 Segitiga sama kaki tidak otomatis sama sisi. Sama sisi otomatis sama kaki.<br>
🔸 Segitiga siku-siku tidak otomatis sama kaki, dan sama kaki tidak otomatis siku-siku.<br>
🔸 Persegi adalah belah ketupat dan persegi panjang. Persegi panjang bukan belah ketupat. Belah ketupat adalah layang-layang.<br>
🔸 Trapesium: tepat <b>satu</b> pasang sisi sejajar. Jajar genjang: <b>dua</b> pasang.<br>
🔸 Layang-layang: sisi <b>berdekatan</b> sama, bukan berhadapan.<br>
🔸 Bukan lingkaran: bentuk kapsul, sinar senter miring, lintasan bumi. Lingkaran: ujung jarum jam, tepi roda sepeda, tepi mata uang.<br>
🔸 Dua lingkaran boleh berpusat sama (konsentris).<br>
🔸 Tangram: 7 potongan dari satu persegi. Luas gabungan = luas persegi, keliling belum tentu.<br>
🔸 Diameter = 2 × jari-jari, dan harus melalui pusat.</p></div></div>

<div class="sec"><h2>🎯 Gambaran Modul 2</h2>
<p>Modul 2 terdiri dari dua kegiatan belajar. KB 1 membahas keliling bangun datar: persegi panjang, persegi, segitiga, jajar genjang, belah ketupat, trapesium, layang-layang, segibanyak beraturan, lingkaran, dan tangram. KB 2 membahas luas daerah bangun-bangun yang sama, ditambah cara mengajarkan keliling dan luas di SD. Tujuan akhirnya: Anda mampu membelajarkan keliling dan luas dengan media dan pendekatan yang tepat, serta mengevaluasi hasil belajar siswa.</p></div>

<div class="sec"><h2>1️⃣ Pengukuran dan Satuan</h2>
<p>Mengukur adalah <b>membandingkan</b> objek yang diukur dengan objek sejenis yang sudah diketahui ukurannya. Objek pembanding itu disebut <b>satuan</b>.</p>
<div class="tw"><table><tr><th>Satuan</th><th>Ciri</th><th>Contoh</th></tr>
<tr><td>Standar</td><td>Ditentukan pemerintah atau definisi matematik, ukurannya tetap</td><td>1 cm, 1 dm, 1 m, 1 km</td></tr>
<tr><td>Tidak standar</td><td>Tidak ditetapkan secara formal, dipilih sendiri sesuai objek</td><td>jengkal, depa, pensil, potongan kawat</td></tr></table></div>
<p>Contoh satuan tidak standar: panjang kelas 6 depa, panjang daun meja 7 pensil, panjang papan tulis 20 jengkal. Mengukur dengan satuan standar berarti menentukan berapa banyak satuan standar yang termuat dalam objek. Ukuran ruas garis adalah panjang, dan ukuran segibanyak (keliling) adalah jumlah panjang sisi-sisinya.</p>
<div class="ingat">🧠 <b>Ingat:</b> standar = sama bagi semua orang (meter). Tidak standar = tergantung orangnya (jengkal Budi dan jengkal Ani bisa beda).</div></div>

<div class="sec"><h2>2️⃣ Keliling Segibanyak</h2>
<p>Keliling segibanyak adalah <b>jumlah panjang sisi-sisinya</b>, yaitu jarak mengitari segibanyak itu. Berlaku untuk semua segibanyak, apa pun jenisnya.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Rumus keliling</th><th>Contoh dari modul</th></tr>
<tr><td>Segitiga (sisi a, b, c)</td><td>a + b + c</td><td>3, 4, 5 cm → 12 cm</td></tr>
<tr><td>Persegi panjang</td><td>a + b + a + b = 2 × (a + b)</td><td>3 dan 4 cm → 14 cm</td></tr>
<tr><td>Persegi</td><td>4 × a</td><td>a = 5 cm → 20 cm</td></tr>
<tr><td>Jajar genjang</td><td>2 × (a + b)</td><td>5 dan 6 cm → 22 cm</td></tr>
<tr><td>Trapesium</td><td>a + b + c + d</td><td>4, 5, 6, 7 cm → 22 cm</td></tr>
<tr><td>Belah ketupat</td><td>4 × a</td><td>a = 5 cm → 20 cm</td></tr>
<tr><td>Layang-layang</td><td>a + a + b + b = 2 × (a + b)</td><td>5 dan 6 cm → 22 cm</td></tr>
<tr><td>Segibanyak lain</td><td>Jumlah semua sisi</td><td>a + b + c + d + e + f + g + h</td></tr></table></div>
<div class="note">⚠️ Pada contoh segitiga di modul, hasil penjumlahan 3 + 4 + 5 tertulis "13 cm" padahal hasilnya 12 cm. Pakai 12 cm.</div>
<h3>Contoh soal latihan</h3>
<div class="tw"><table><tr><th>Soal</th><th>Jawaban</th></tr>
<tr><td>Keliling persegi bersisi 10 cm</td><td>4 × 10 = 40 cm</td></tr>
<tr><td>Jajar genjang dengan dua sisi berurutan 8 cm dan 14 cm</td><td>2 × (8 + 14) = 44 cm</td></tr>
<tr><td>Segienam beraturan bersisi 12 cm</td><td>6 × 12 = 72 cm</td></tr>
<tr><td>Lingkaran jari-jari 5 cm</td><td>2 × π × 5 = 10π cm</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> bayangkan pagar kebun. Keliling = panjang pagar yang dibutuhkan untuk mengitari semuanya. Persegi panjang, jajar genjang, layang-layang sama-sama "2 × (a + b)". Persegi dan belah ketupat "4 × sisi".</div></div>

<div class="sec"><h2>3️⃣ Keliling Lingkaran</h2>
<p>"Jarak mengitari" lingkaran disebut keliling lingkaran. Diperlukan bilangan khusus <b>π (pi)</b>, yaitu perbandingan keliling lingkaran dengan diameternya. Pada setiap lingkaran perbandingan ini selalu tetap (konstan).</p>
<p>Nilai sebenarnya π = 3,14159... bilangan desimal tak berulang dan tak berakhir, yaitu <b>bilangan irasional</b>. Nilai pendekatannya sama dengan 22/7.</p>
<div class="tw"><table><tr><th>Lambang</th><th>Arti</th><th>Rumus</th></tr>
<tr><td>r</td><td>jari-jari</td><td>d = 2 × r</td></tr>
<tr><td>d</td><td>diameter</td><td>K = π × d</td></tr>
<tr><td>K</td><td>keliling lingkaran</td><td>K = 2 × π × r</td></tr></table></div>
<p>Contoh: jari-jari 3 cm, maka K = 2 × π × 3 = 6π cm.</p>
<div class="ingat">🧠 <b>Ingat:</b> keliling lingkaran kira-kira 3 kali lebih panjang dari diameternya. Itulah arti π.</div></div>

<div class="sec"><h2>4️⃣ Keliling Tangram</h2>
<p>Keliling tangram dihitung dari jumlah panjang <b>sisi-sisi tepi luar</b>. Jika bentuk gabungan sederhana, hitung beberapa sisi tepinya saja. Jika bentuknya rumit, hitung semua sisi tepi, misalnya a + b + c + d + d + d + e + f + g + h + h + h + i.</p>
<p>Keliling potongan-potongan tangram yang digabung <b>belum tentu sama</b> dengan keliling persegi awalnya, tergantung bentuk gabungan yang terbentuk. Dua bangun berbeda dari potongan yang sama punya keliling berbeda.</p>
<div class="ingat">🧠 <b>Ingat:</b> luas gabungan tetap, keliling bisa berubah. Seperti adonan: dibentuk apa pun volumenya sama, tetapi tepinya bisa lebih panjang.</div></div>

<div class="sec"><h2>5️⃣ Mengajarkan Keliling ke Siswa SD</h2>
<p><b>Dengan tali atau benang:</b> buat model segibanyak, tempelkan benang pada sisi-sisinya mulai dari satu titik dan berakhir di titik yang sama, lalu ukur panjang benang. Cara ini berlaku untuk bermacam bangun datar.</p>
<p><b>Dengan meteran kain:</b> ukur setiap sisi, lalu jumlahkan semua panjang sisinya.</p></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 1)</h2><div class="ujian"><p>
🔸 Keliling = jumlah sisi (jarak mengitari). Luas bukan itu.<br>
🔸 K = π × d = 2 × π × r. Jangan tertukar dengan jari-jari: d = 2r.<br>
🔸 Diameter tidak sama dengan jari-jari.<br>
🔸 Dua lingkaran yang sama punya keliling yang sama.<br>
🔸 Keliling gabungan potongan tangram belum tentu sama dengan keliling tangram aslinya (pilihan "sama" adalah jebakan).<br>
🔸 π adalah bilangan irasional, 22/7 hanya pendekatan.<br>
🔸 Keliling persegi panjang: 2 × (a + b), bukan a × b.<br>
🔸 Soal balik: diketahui keliling, cari sisi atau jari-jari (misalnya 60 = 2 × (a + 20), maka a = 10).<br>
🔸 Segienam beraturan bersisi s: keliling 6s.</p></div></div>

<div class="note">📌 <b>Modul 2, Kegiatan Belajar 2: Luas Daerah.</b></div>

<div class="sec"><h2>1️⃣ Apa Itu Luas Daerah?</h2>
<p>Mengukur luas mirip mengukur panjang ruas garis. Mengukur ruas garis AB berarti membandingkannya dengan satuan standar (m, dm, cm, inci, kaki, yard) dan hasilnya bilangan yang menyatakan banyaknya satuan yang tercakup. Begitu pula luas: <b>luas daerah A adalah bilangan yang menyatakan berapa banyak satuan standar yang tercakup pada daerah A</b>.</p>
<p>Satuan standar luas bisa berupa satuan segitiga sama sisi, persegi, lingkaran, segilima beraturan, atau segienam beraturan. Yang paling umum adalah <b>satuan persegi</b> (square unit).</p>
<div class="ingat">🧠 <b>Ingat:</b> keliling diukur dengan "satuan panjang" (cm), luas diukur dengan "satuan persegi" (cm²). Bayangkan menutup lantai dengan ubin: luas = banyak ubin yang muat.</div></div>

<div class="sec"><h2>2️⃣ Definisi dan Postulat</h2>
<div class="tw"><table><tr><th>Nama</th><th>Isi</th></tr>
<tr><td>Definisi 1</td><td>Daerah segitiga adalah gabungan himpunan titik-titik pada segitiga dan titik-titik interior segitiga itu. Berlaku juga untuk segiempat, segilima, segibanyak lain, dan lingkaran.</td></tr>
<tr><td>Definisi 2</td><td>Luas daerah yang ditutup kurva tertutup atau segibanyak adalah bilangan yang menyatakan banyaknya satuan persegi yang termuat dalam daerah itu.</td></tr>
<tr><td>Postulat 1</td><td>Jika irisan dua segibanyak adalah suatu garis, luas daerah gabungannya sama dengan jumlah luas kedua segibanyak.</td></tr>
<tr><td>Postulat 2</td><td>Luas persegi panjang sama dengan hasil kali ukuran panjang dan lebarnya.</td></tr>
<tr><td>Postulat 3</td><td>Jika dua segitiga kongruen (sama dan sebangun), luas keduanya sama.</td></tr></table></div>
<p>Contoh Postulat 2: persegi panjang 8 m × 10 m, maka L = 8 × 10 = 80 m².</p>
<div class="ingat">🧠 <b>Ingat:</b> kongruen = sama persis, boleh diputar atau dibalik. Dua kue yang dicetak dari cetakan sama luasnya pasti sama.</div></div>

<div class="sec"><h2>3️⃣ Teorema Luas Segiempat dan Segitiga</h2><div class="il"><svg viewBox="0 0 400 130" role="img"><polygon class="f" points="20,100 110,100 140,40 50,40"/><line class="h" x1="50" y1="40" x2="50" y2="100"/><polygon class="f" points="170,100 260,100 215,40"/><line class="h" x1="215" y1="40" x2="215" y2="100"/><polygon class="f" points="290,100 390,100 370,40 320,40"/><line class="h" x1="320" y1="40" x2="320" y2="100"/><text x="55" y="114">alas</text><text x="30" y="75">tinggi</text><text x="20" y="127">alas × tinggi</text><text x="190" y="114">alas</text><text x="222" y="75">tinggi</text><text x="165" y="127">½ × alas × tinggi</text><text x="320" y="114">sisi alas</text><text x="323" y="34">sisi atas</text><text x="290" y="127">½ × t × (a + b)</text></svg><small>Garis pink putus-putus = tinggi (selalu tegak lurus alas)</small></div>
<div class="tw"><table><tr><th>Bangun</th><th>Rumus luas</th><th>Contoh dari modul</th></tr>
<tr><td>Persegi panjang</td><td>panjang × lebar</td><td>8 m × 10 m = 80 m²</td></tr>
<tr><td>Jajar genjang (Teorema 1)</td><td>alas × tinggi</td><td>10 dm × 6 dm = 60 dm²</td></tr>
<tr><td>Segitiga (Teorema 2)</td><td>½ × alas × tinggi</td><td>½ × 18 × 10 = 90 cm²</td></tr>
<tr><td>Trapesium (Teorema 3)</td><td>½ × tinggi × (sisi alas + sisi atas)</td><td>½ × 10 × (12 + 8) = 100 m²</td></tr>
<tr><td>Belah ketupat (Teorema 5)</td><td>½ × diagonal 1 × diagonal 2</td><td>½ × 18 × 12 = 108 cm²</td></tr></table></div>
<p><b>Teorema 4:</b> jika dua segitiga alasnya kongruen dan garis tingginya kongruen, maka luas keduanya sama.</p>
<p>Catatan: pada trapesium, "alas dan atas" adalah sisi-sisi yang <b>sejajar</b>. Teorema 1 dan 2 di modul disertai perintah "Buktikan!" sebagai tugas bagi pembaca.</p>
<div class="ingat">🧠 <b>Ingat:</b> segitiga adalah "separuh" jajar genjang, maka ada ½. Trapesium memakai rata-rata sisi sejajar dikali tinggi. Belah ketupat: dua diagonal dikali lalu dibagi dua.</div></div>

<div class="sec"><h2>4️⃣ Segibanyak Beraturan dan Apotema</h2>
<p><b>Definisi 3:</b> segibanyak beraturan adalah segibanyak yang sisinya kongruen dan sudutnya kongruen. Segibanyak beraturan punya lingkaran luar dan lingkaran dalam, dan pada setiap lingkaran dapat dibuat segi-n beraturan. Titik pusat lingkaran itu adalah titik pusat segibanyak.</p>
<p><b>Definisi 4:</b> <b>apotema</b> adalah ruas garis dari titik pusat segibanyak beraturan ke titik tengah sebarang sisinya.</p>
<p><b>Teorema 6:</b> luas segibanyak beraturan = <b>½ × apotema × keliling</b>.</p>
<p>Contoh: segiempat beraturan bersisi 8 dm. Apotema 4 dm, keliling 4 × 8 = 32 dm, maka L = ½ × 4 × 32 = 64 dm². Cek: segiempat beraturan adalah persegi, 8 × 8 = 64 dm².</p>
<div class="ingat">🧠 <b>Ingat:</b> segibanyak beraturan = gabungan segitiga-segitiga yang berpusat di tengah. Tinggi tiap segitiga adalah apotema, jumlah alasnya adalah keliling.</div></div>

<div class="sec"><h2>5️⃣ Luas Lingkaran dan Tangram</h2>
<p>Daerah yang dibatasi lingkaran disebut daerah lingkaran, ukurannya disebut luas lingkaran: <b>L = π × r²</b>. Contoh: r = 3 cm, maka L = π × 3² = 9π cm².</p>
<p><b>Tangram:</b> luas tangram sama dengan luas persegi asalnya, bagaimana pun bentuk yang dibangun, karena semua dibangun dari bangun-bangun pada persegi semula.</p>
<div class="tw"><table><tr><th>Ukuran</th><th>Gabungan potongan tangram</th></tr><tr><td>Luas</td><td>Tetap sama dengan luas persegi awal</td></tr><tr><td>Keliling</td><td>Belum tentu sama, tergantung bentuk</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> L = π r² (r dikuadratkan), K = 2 π r (r tidak dikuadratkan). "Luas pakai kuadrat" karena luas itu dua dimensi.</div></div>

<div class="sec"><h2>6️⃣ Contoh Soal Latihan</h2>
<div class="tw"><table><tr><th>Soal</th><th>Jawaban</th></tr>
<tr><td>Sawah persegi panjang 50 m × 30 m</td><td>1.500 m²</td></tr>
<tr><td>Persegi bersisi 10 m</td><td>100 m²</td></tr>
<tr><td>Jajar genjang alas 20 cm, tinggi 8 cm</td><td>160 cm²</td></tr>
<tr><td>Segitiga alas 42 cm, tinggi 17 cm</td><td>½ × 42 × 17 = 357 cm²</td></tr>
<tr><td>Luas segitiga 195 m², tinggi 15 m, cari alas</td><td>195 = ½ × a × 15, maka a = 26 m</td></tr>
<tr><td>Trapesium sisi sejajar 8 dm dan 12 dm, tinggi 6 dm</td><td>½ × 6 × 20 = 60 dm²</td></tr></table></div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 2)</h2><div class="ujian"><p>
🔸 Segitiga dan trapesium memakai ½. Persegi panjang dan jajar genjang tidak.<br>
🔸 Luas lingkaran π r², keliling 2 π r. Jangan tertukar.<br>
🔸 Luas belah ketupat memakai <b>diagonal</b>, bukan sisi.<br>
🔸 Luas segibanyak beraturan = ½ × apotema × keliling.<br>
🔸 Dua lingkaran yang sama punya luas yang sama (pilihan "berbeda" salah).<br>
🔸 Luas gabungan potongan tangram selalu sama dengan luas tangram. Kelilingnya belum tentu.<br>
🔸 Persegi bersisi 10 cm berisi tangram, luasnya tepat 100 cm² (bukan lebih, bukan kurang).<br>
🔸 Titik tengah sisi persegi dihubungkan, luas persegi baru menjadi separuhnya. Dua kali berturut-turut jadi ¼ (100 → 50 → 25 cm²).<br>
🔸 Satuan luas: cm², m², dm² (ada pangkat 2), keliling tanpa pangkat.<br>
🔸 Apotema: titik pusat ke titik tengah sisi.</p></div></div>

<div class="sec"><h2>📍 Letak materi di modul</h2>
<div class="tw"><table><tr><th>Bagian</th><th>Halaman</th></tr>
<tr><td>Pengertian luas, definisi dan postulat</td><td>2.18 – 2.20</td></tr>
<tr><td>Teorema 1 sampai 5 (jajar genjang, segitiga, trapesium, belah ketupat)</td><td>2.20 – 2.22</td></tr>
<tr><td>Segibanyak beraturan, apotema, Teorema 6</td><td>2.22 – 2.23</td></tr>
<tr><td>Luas lingkaran dan tangram</td><td>2.23 – 2.24</td></tr>
<tr><td>Latihan dan rangkuman KB 2</td><td>2.24 – 2.25</td></tr>
<tr><td>Tes Formatif 2</td><td>2.26 – 2.27</td></tr>
<tr><td>Kunci Jawaban Tes Formatif</td><td>2.29</td></tr></table></div>

const M3_KB1=`
<div class="note">📌 <b>Modul 3, Kegiatan Belajar 1: Bidang Banyak dan Bangun Ruang.</b> Materi KB 2 (Jaring-Jaring Bangun Ruang) ada di tab sebelahnya.</div>

<div class="sec"><h2>🎯 Gambaran Modul 3</h2>
<p>Modul 3 punya dua kegiatan belajar: KB 1 Bidang Banyak dan Bangun Ruang, KB 2 Jaring-Jaring Bangun Ruang. Pembahasannya lebih menekankan segi praktis, dengan banyak contoh, dan menunjang penghitungan luas permukaan bangun ruang. Prasyaratnya: konsep bangun ruang, nama dan unsur-unsurnya, luas bidang datar, dan konsep ukuran dari modul sebelumnya.</p></div>

<div class="sec"><h2>1️⃣ Bidang Datar: Titik, Garis, Bidang</h2>
<p>Segi n dibatasi n garis pembatas yang disebut <b>sisi</b>. Papan tulis dan dinding tembok memberi gagasan tentang <b>bidang datar</b>, yaitu permukaan yang rata. Anggap kelas sebagai ruang. Garis AB, titik C di luar garis, dan titik D pada garis AB: titik C dan D menentukan satu garis. Semua garis itu terletak pada satu permukaan rata, yaitu bidang datar yang ditentukan garis AB dan titik C. Pada bidang itu ada garis melalui C yang sejajar AB.</p>
<div class="tw"><table><tr><th>Kesepakatan</th><th>Bunyi</th></tr>
<tr><td>Garis dan titik</td><td>Satu garis dan satu titik di luar garis menentukan <b>tepat satu</b> bidang datar</td></tr>
<tr><td>Tiga titik</td><td>Tiga titik yang tidak segaris menentukan tepat satu bidang. Contoh: meja berkaki tiga tidak pernah goyang</td></tr>
<tr><td>Dua garis</td><td>Dua garis berlainan dalam ruang berpotongan di satu titik atau tidak berpotongan. Jika sebidang dan tidak berpotongan, keduanya sejajar</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> tiga titik tidak segaris = tepat satu bidang. Karena itu tripod kamera berdiri kokoh, sedangkan kursi berkaki empat bisa goyang.</div></div>

<div class="sec"><h2>2️⃣ Garis dan Bidang, Dua Bidang</h2>
<div class="tw"><table><tr><th>Garis dan bidang (salah satu pasti benar)</th></tr>
<tr><td>1. Garis terletak dalam bidang</td></tr>
<tr><td>2. Garis memotong bidang di satu titik</td></tr>
<tr><td>3. Garis sejajar bidang (tidak punya titik persekutuan sama sekali)</td></tr></table></div>
<div class="tw"><table><tr><th>Dua bidang berlainan (salah satu pasti benar)</th></tr>
<tr><td>1. Irisannya sebuah <b>garis</b> (berpotongan)</td></tr>
<tr><td>2. Irisannya <b>kosong</b> (sejajar)</td></tr></table></div>
<p>Jika dua bidang berimpit, keduanya dianggap sama. Garis pembatas bidang disebut <b>sisi bidang</b>.</p>
<div class="ingat">🧠 <b>Ingat:</b> dua bidang berlainan hanya punya dua kemungkinan: garis atau kosong. Tidak mungkin titik tunggal.</div></div>

<div class="sec"><h2>3️⃣ Bangun Ruang dan Bidang Banyak</h2><div class="il"><svg viewBox="0 0 320 165" role="img"><g class="s"><rect x="30" y="60" width="130" height="80"/><polyline points="30,60 90,20 220,20 160,60"/><polyline points="220,20 220,100 160,140"/></g><g class="s d"><polyline points="30,140 90,100 220,100"/><line x1="90" y1="100" x2="90" y2="20"/></g><circle class="p" cx="160" cy="140" r="3.5"/><text x="20" y="152">A</text><text x="164" y="154">B</text><text x="224" y="104">C</text><text x="80" y="114">D</text><text x="20" y="58">E</text><text x="164" y="58">F</text><text x="224" y="20">G</text><text x="82" y="16">H</text><text x="70" y="102" fill="none"></text><text x="72" y="82">sisi</text><text x="60" y="160">rusuk</text><text x="230" y="140">titik sudut</text></svg><small>Balok: 6 sisi, 12 rusuk, 8 titik sudut (garis putus-putus = tersembunyi)</small></div>
<p>Kotak korek api, dadu, dan batu bata adalah contoh bangun ruang. Bangun ruang dibatasi <b>sisi berbentuk bidang</b>, berbeda dengan bidang yang sisinya berupa garis. Batu bata punya 6 permukaan berbentuk persegi panjang, masing-masing disebut sisi.</p>
<p><b>Bidang banyak</b> adalah bangun ruang <b>tertutup</b> yang sisinya datar dan berbentuk segibanyak.</p>
<div class="tw"><table><tr><th>Unsur</th><th>Arti</th></tr>
<tr><td>Sisi</td><td>Daerah bidang yang membatasi bangun ruang</td></tr>
<tr><td>Rusuk</td><td>Perpotongan dua sisi</td></tr>
<tr><td>Titik sudut</td><td>Perpotongan dua rusuk atau lebih</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> sisi = "dinding", rusuk = "garis sudut ruangan", titik sudut = "pojok ruangan".</div></div>

<div class="sec"><h2>4️⃣ Prisma Siku-Siku, Kubus, Balok, Prisma, Limas</h2>
<p><b>Prisma siku-siku</b> (boleh disebut kotak): bangun ruang yang semua sisinya daerah persegi panjang. Contoh: kotak pasta gigi, kotak kapur tulis, kotak korek api. Punya <b>6 sisi, 12 rusuk, 8 titik sudut</b>.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Ciri</th><th>Contoh</th></tr>
<tr><td>Kubus</td><td>Prisma siku-siku yang semua sisinya bujursangkar</td><td>Dadu</td></tr>
<tr><td>Balok</td><td>Prisma siku-siku yang sisi-sisi sejajarnya persegi panjang</td><td>Korek api</td></tr>
<tr><td>Prisma</td><td>Dua sisi sama dan sebangun pada dua bidang sejajar, sisi lain persegi panjang</td><td>Prisma segitiga</td></tr>
<tr><td>Limas</td><td>Rusuk tegaknya bertemu di satu titik, alasnya segitiga, segiempat, atau segi-n</td><td>Limas segiempat, limas segitiga, piramida</td></tr></table></div>
<p>Pada prisma dan limas, perpotongan dua sisi berupa rusuk, perpotongan tiga sisi atau lebih berupa titik.</p>
<div class="ingat">🧠 <b>Ingat:</b> prisma = dua "tutup" kembar (atas dan bawah). Limas = satu alas dan satu "puncak".</div></div>

<div class="sec"><h2>5️⃣ Bangun Ruang Sisi Lengkung</h2><div class="il"><svg viewBox="0 0 360 120" role="img"><g class="f"><path d="M30,25 L30,90 A30,10 0 0 0 90,90 L90,25 Z"/><path d="M160,90 L190,20 L220,90 A30,10 0 0 1 160,90 Z"/><circle cx="310" cy="55" r="35"/></g><g class="s"><ellipse cx="60" cy="25" rx="30" ry="10"/><path d="M280,55 A30,10 0 0 0 340,55" class="d"/></g><text x="38" y="112">tabung</text><text x="165" y="112">kerucut</text><text x="290" y="112">bola</text></svg><small>Tiga bangun ruang bersisi lengkung</small></div>
<div class="tw"><table><tr><th>Bangun</th><th>Ciri</th></tr>
<tr><td>Tabung (silinder)</td><td>Dua sisi bundar (daerah lingkaran) pada dua bidang sejajar, sisi lainnya lengkung</td></tr>
<tr><td>Kerucut</td><td>Satu sisi bundar, sisi lainnya lengkung</td></tr>
<tr><td>Bola</td><td>Tidak punya sisi datar, seluruhnya lengkung</td></tr></table></div>
<p>Ketiganya <b>bangun ruang tetapi bukan bidang banyak</b>. Telur bukan bola karena bulatnya tidak sempurna. Contoh bola: gelembung sabun, balon karet. Cara menyelidiki bulat sempurna: gelindingkan di permukaan datar. Bola sempurna bergulir sepanjang garis lurus.</p>
<div class="ingat">🧠 <b>Ingat:</b> bidang banyak = "datar semua". Ada satu saja sisi lengkung, bukan bidang banyak.</div></div>

<div class="sec"><h2>6️⃣ Rumus Prisma dan Limas</h2>
<div class="tw"><table><tr><th>Bangun segi-n</th><th>Banyak sisi</th><th>Banyak rusuk</th><th>Banyak titik sudut</th></tr>
<tr><td>Prisma</td><td>n + 2</td><td>n × 3</td><td>n × 2</td></tr>
<tr><td>Limas</td><td>n + 1</td><td>n × 2</td><td>n + 1</td></tr></table></div>
<div class="tw"><table><tr><th>Contoh</th><th>Sisi</th><th>Rusuk</th><th>Titik sudut</th></tr>
<tr><td>Prisma segitiga</td><td>5</td><td>9</td><td>6</td></tr>
<tr><td>Prisma segiempat</td><td>6</td><td>12</td><td>8</td></tr>
<tr><td>Prisma segilima</td><td>7</td><td>15</td><td>10</td></tr>
<tr><td>Limas segitiga</td><td>4</td><td>6</td><td>4</td></tr>
<tr><td>Limas segiempat</td><td>5</td><td>8</td><td>5</td></tr></table></div>
<div class="note">⚠️ Pada petunjuk jawaban latihan modul, banyak titik sudut prisma siku-siku tertulis 24. Itu salah ketik, yang benar 8 (n × 2 untuk n = 4).</div>
<div class="ingat">🧠 <b>Ingat:</b> prisma: "<b>n+2, 3n, 2n</b>" (sisi, rusuk, titik). Limas: "<b>n+1, 2n, n+1</b>". Limas: sisi dan titik sudut selalu sama banyak.</div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 1)</h2><div class="ujian"><p>
🔸 Satu garis dan satu titik di luar garis: tepat <b>satu</b> bidang, dan tepat satu garis sejajar yang melalui titik itu. Pilihan "dua bidang" atau "banyak garis sejajar" salah.<br>
🔸 Irisan dua bidang berlainan: garis atau kosong. Jawaban "garis" saja belum lengkap untuk soal "pasti".<br>
🔸 Tiga titik yang tidak segaris: tepat satu bidang, bukan tiga.<br>
🔸 Yang <b>bukan</b> bidang banyak: kerucut, tabung, bola.<br>
🔸 Kerangka rumah berbentuk prisma segilima: 7 sisi, 15 rusuk, 10 titik sudut.<br>
🔸 Garis yang tidak berimpit dengan rusuk (misalnya garis di atap yang bukan rusuk) jangan dihitung sebagai rusuk.<br>
🔸 Prisma siku-siku punya 8 titik sudut, bukan 24.<br>
🔸 Kubus = semua sisi bujursangkar. Balok = sisi persegi panjang.</p></div></div>

const M3_KB2=`
<div class="note">📌 <b>Modul 3, Kegiatan Belajar 2: Jaring-Jaring Bangun Ruang.</b></div>

<div class="sec"><h2>1️⃣ Menggambar Bangun Ruang</h2>
<p>Sebelum menggambar jaring-jaring, kita harus bisa menggambar bangun ruangnya. Ada tiga bangun yang dijelaskan langkahnya.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Langkah menggambar</th></tr>
<tr><td>Silinder (tabung)</td><td>1) Buat dua garis sejajar dan sama tinggi sesuai ukuran. 2) Gambar elips pada alas dan tutup. 3) Gambar garis putus-putus pada tepi elips alas bagian dalam.</td></tr>
<tr><td>Limas segitiga</td><td>1) Gambar segitiga sebagai sisi tegak bagian depan. 2) Tentukan titik di bagian dalam dan bawah segitiga itu. 3) Tarik garis putus-putus dari titik tadi ke sudut-sudut segitiga.</td></tr>
<tr><td>Kerucut</td><td>1) Gambar garis putus-putus mendatar. 2) Gambar elips dengan garis itu sebagai garis tengah, bagian belakang tepi elips putus-putus. 3) Gambar garis tinggi putus-putus pada titik tengah garis tadi. 4) Hubungkan titik atas garis tinggi dengan ujung kiri dan kanan elips.</td></tr></table></div>
<p>Pada limas segitiga, rusuk tegaknya bertemu di satu titik, sedangkan sisi tegak dan alasnya berupa segitiga.</p>
<div class="ingat">🧠 <b>Ingat:</b> garis <b>putus-putus</b> dipakai untuk bagian yang "tersembunyi" di belakang, seperti melihat gelas kaca dari depan.</div></div>

<div class="sec"><h2>2️⃣ Pengertian Jaring-Jaring</h2><div class="il"><svg viewBox="0 0 320 122" role="img"><g class="f"><rect x="50" y="10" width="30" height="30"/><rect x="20" y="40" width="30" height="30"/><rect x="50" y="40" width="30" height="30"/><rect x="80" y="40" width="30" height="30"/><rect x="110" y="40" width="30" height="30"/><rect x="50" y="70" width="30" height="30"/><rect x="180" y="40" width="100" height="40"/><circle cx="210" cy="24" r="16"/><circle cx="250" cy="96" r="16"/></g><text x="18" y="116">jaring-jaring kubus</text><text x="185" y="116">jaring-jaring silinder</text></svg><small>Rebahan bangun ruang: kubus (6 persegi) dan silinder (persegi panjang + 2 lingkaran)</small></div>
<p>Cara membuat jaring-jaring dari bangun ruang: (1) <b>iris</b> pada setiap sambungan bidang, tetapi jangan sampai putus, (2) <b>rentangkan</b> bidang-bidang itu sehingga membentuk rangkaian bidang.</p>
<p><b>Jaring-jaring bangun ruang adalah rangkaian bidang datar yang apabila digabungkan akan membentuk bangun ruang.</b></p>
<p>Contoh bangun dan jaring-jaringnya yang dibahas: silinder, limas segiempat, kerucut, kubus, dan prisma segitiga.</p>
<div class="ingat">🧠 <b>Ingat:</b> bayangkan membuka kardus bekas susu sampai rata. Hasil rebahan itulah jaring-jaring. Kalau dilipat lagi, kembali jadi kotak.</div></div>

<div class="sec"><h2>3️⃣ Bidang Penyusun Tiap Bangun</h2>
<div class="tw"><table><tr><th>Bangun</th><th>Bidang yang diperlukan</th></tr>
<tr><td>Kubus</td><td>6 buah persegi (bujursangkar)</td></tr>
<tr><td>Balok</td><td>Persegi panjang (6 sisi)</td></tr>
<tr><td>Silinder</td><td>Satu persegi panjang (selimut) dan dua lingkaran (alas dan tutup)</td></tr>
<tr><td>Limas segitiga</td><td>Empat buah segitiga</td></tr>
<tr><td>Limas segiempat</td><td>Empat buah segitiga dan satu persegi panjang</td></tr>
<tr><td>Kerucut</td><td>Satu lingkaran dan satu bidang lengkung (selimut)</td></tr>
<tr><td>Prisma segitiga</td><td>Dua segitiga dan tiga persegi panjang</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> silinder = "gulungan persegi panjang + dua tutup bulat". Limas segitiga = 4 segitiga. Limas segiempat = 4 segitiga + 1 alas.</div></div>

<div class="sec"><h2>4️⃣ Tidak Semua Rangkaian Bidang Adalah Jaring-Jaring</h2>
<p>Rangkaian bidang disebut jaring-jaring jika dapat dibentuk menjadi bangun ruang. Jika tidak bisa, bukan jaring-jaring.</p>
<div class="tw"><table><tr><th>Contoh</th><th>Hasil</th></tr>
<tr><td>Dua lingkaran dan satu persegi panjang (dirangkai tepat)</td><td>Jaring-jaring silinder</td></tr>
<tr><td>Dua segitiga dan tiga persegi panjang pada rangkaian yang tidak bisa ditutup</td><td>Bukan jaring-jaring prisma segitiga</td></tr>
<tr><td>Dari empat rangkaian (Gambar 3.16)</td><td>Hanya gambar d yang jaring-jaring prisma segitiga</td></tr>
<tr><td>Dari empat rangkaian (Gambar 3.18)</td><td>a dan b jaring-jaring kubus, c dan d bukan</td></tr></table></div>
<p>Jaring-jaring kubus <b>tidak hanya satu</b>. Dengan mengiris sambungan yang berbeda, diperoleh susunan yang berbeda. Limas segiempat pun punya lebih dari satu jaring-jaring.</p>
<div class="ingat">🧠 <b>Ingat:</b> cara memastikan: lipat rangkaian itu. Kalau menutup rapat tanpa tumpang tindih dan tanpa celah, itu jaring-jaring. Kalau ada sisi bertumpuk atau bolong, bukan.</div></div>

<div class="sec"><h2>5️⃣ Media Mengajarkan Jaring-Jaring ke Siswa</h2>
<p>Gunakan <b>alat peraga</b> berupa bangun ruang buatan sendiri. Bahan: kertas atau karton, lem dan benang, gunting, pensil, penggaris.</p>
<h3>Membuat alat peraga silinder</h3>
<p>1) Gambar 2 lingkaran pada karton, misalnya jari-jari 10 cm. 2) Gunting lingkaran dengan sisa sekitar 1 cm di luar garis. 3) Buat persegi panjang dengan <b>lebar sama dengan keliling lingkaran</b> (ukur keliling dengan benang), beri sisa 1 cm. 4) Gulung persegi panjang menjadi selimut tabung. 5) Pasang lingkaran pada alas dan tutup.</p>
<h3>Langkah menyampaikan materi</h3>
<p>Ambil bangun ruang (misalnya kubus), tunjukkan bahwa kubus dibuat dari 6 persegi. Iris tiap sambungan tanpa memutus, lalu rentangkan sehingga terbentuk jaring-jaring. Ulangi dengan sambungan lain agar siswa melihat jaring-jaring kubus tidak hanya satu. Lanjutkan ke limas segiempat (empat segitiga dan satu persegi panjang) dan tanyakan apakah ada bentuk jaring-jaring lain. Lalu lakukan sebaliknya: beri rangkaian bidang, minta siswa membentuk bangun ruang. Bisa dibentuk berarti jaring-jaring, tidak bisa berarti bukan.</p>
<div class="ingat">🧠 <b>Ingat:</b> dua arah belajar: <b>bangun → jaring-jaring</b> (iris dan rentangkan), dan <b>rangkaian → bangun</b> (lipat dan uji).</div></div>

<div class="sec"><h2>6️⃣ Contoh Soal Latihan</h2>

<div class="sec"><h2>🎯 Gambaran Modul 4</h2>
<p>Modul 4 membahas volume bangun ruang yang sudah dikenal: kubus, balok, prisma, kerucut, silinder, dan bola. Ada empat Kegiatan Belajar: KB 1 Volume Kubus dan Balok, KB 2 Volume Prisma Tegak dan Silinder, KB 3 Volume Limas dan Kerucut, KB 4 Volume Bola. Prasyaratnya: konsep bangun ruang, nama dan unsurnya, luas bidang datar, dan konsep ukuran. KB 1 menjadi syarat untuk KB selanjutnya, jadi kuasai dulu sebelum lanjut.</p></div>

<div class="sec"><h2>1️⃣ Apa Itu Volume?</h2>
<p><b>Volume</b> suatu bangun ruang adalah ukuran yang menyatakan <b>kuantitas ruangan yang ditempati</b> bangun ruang itu. Bayangkan mengisi kotak dengan kubus-kubus mungil: banyaknya kubus mungil yang muat itulah ukuran volumenya.</p>
<p>Untuk bangun ruang berongga (dinding sangat tipis), volume juga bisa dinyatakan sebagai <b>banyaknya tepung atau cairan yang memenuhi rongganya</b>. Contoh: kotak kubus yang penuh diisi 2 liter air, volumenya 2 liter. Bak yang penuh oleh 3 ember air 10 liter, volumenya 3 × 10 = 30 liter.</p>
<div class="ingat">🧠 <b>Ingat:</b> volume = "isi", keliling = "pagar", luas = "alas lantai". Tiga ukuran, tiga arti.</div></div>

<div class="sec"><h2>2️⃣ Membandingkan Volume Dua Bangun Ruang</h2>
<p>Dua bangun ruang bervolume <b>sama</b> jika dan hanya jika kuantitas ruangan yang ditempatinya sama, atau banyaknya tepung/cairan yang memenuhinya sama.</p>
<div class="tw"><table><tr><th>Langkah</th><th>Isi</th></tr>
<tr><td>1</td><td>Isi penuh bangun ruang A dengan air (pasir)</td></tr>
<tr><td>2</td><td>Tuang ke bangun ruang B, tidak boleh ada yang tumpah</td></tr>
<tr><td>3</td><td>Semua air pas memenuhi B, maka volume A = volume B</td></tr>
<tr><td>4</td><td>Air habis tetapi B belum penuh, maka volume A <b>kurang dari</b> volume B</td></tr>
<tr><td>5</td><td>B sudah penuh dan air di A masih sisa, maka volume A <b>lebih dari</b> volume B</td></tr></table></div>
<p>Contoh: semua bola voli volumenya sama. Bola voli lebih kecil dari bola basket, tetapi lebih besar dari bola tenis.</p>
<div class="ingat">🧠 <b>Ingat:</b> seperti menuang teh dari gelas A ke gelas B. Habis pas = sama, belum penuh = A lebih kecil, sisa = A lebih besar.</div></div>

<div class="sec"><h2>3️⃣ Satuan Volume</h2>
<p>Pada sistem metrik, <b>1 liter</b> adalah volume kubus yang sisinya 10 cm (1 dm), jadi <b>1 L = 1 dm³</b>. Untuk memenuhinya diperlukan 10 × 10 = 100 kubus sentimeter per lapisan, dan ada 10 lapisan, jadi <b>1 L = 1.000 cm³</b>. Awalan "mili" artinya satu per seribu, maka <b>1 mL = 1 cm³</b>.</p>
<div class="il"><svg viewBox="0 0 360 150" role="img"><g class="f"><polygon points="20,50 110,50 110,130 20,130"/><polygon points="20,50 50,25 140,25 110,50"/><polygon points="110,50 140,25 140,105 110,130"/><polygon points="250,115 262,115 262,127 250,127"/><polygon points="250,115 255,111 267,111 262,115"/><polygon points="262,115 267,111 267,123 262,127"/></g><text x="38" y="146">10 cm × 10 cm × 10 cm</text><text x="160" y="60">1 liter = 1 dm³</text><text x="160" y="78">= 1.000 cm³</text><text x="160" y="96">kubus kecil 1 cm³</text><text x="160" y="112">= 1 mililiter (mL)</text><text x="160" y="130">1 m³ = 1 kiloliter</text></svg><small>Kubus liter berisi 1.000 kubus sentimeter</small></div>
<div class="tw"><table><tr><th>Satuan</th><th>Singkatan</th><th>Nilai dalam liter</th><th>Golongan</th></tr>
<tr><td>Mililiter (sentimeter kubik)</td><td>mL (cm³)</td><td>0,001 L</td><td>Satuan kecil</td></tr>
<tr><td>Liter (desimeter kubik)</td><td>L (dm³)</td><td>1 L</td><td>Satuan dasar</td></tr>
<tr><td>Kiloliter (meter kubik)</td><td>kL (m³)</td><td>1.000 L</td><td>Satuan besar</td></tr></table></div>
<p>Hubungan lain: 1 kL = 1.000 L, 1 mL = 0,001 L, 1 m³ = 1.000 dm³. Secara umum <b>r liter = (r × 1.000) cm³</b>. Contoh: 2 L = 2.000 cm³ dan ½ L = 500 cm³.</p>
<p>Pada sistem Inggris, satuan volume adalah quart: 1 quart = 0,9463 liter, jadi liter sedikit lebih besar dari quart. Contoh sehari-hari: botol berlabel "isi 1 liter" bila dituang ke kubus sisi 10 cm akan pas penuh. Isi minuman kaleng sering ditulis mL (misalnya 250 mL), tangki air besar ditulis m³ (misalnya 25 m³).</p>

<div class="ingat">🧠 <b>Ingat:</b> <b>1 liter = 1 dm³ = 1.000 cm³ = 1.000 mL</b>. Tangga turun dari m³ ke dm³ ke cm³ selalu dikali 1.000.</div></div>

<div class="sec"><h2>4️⃣ Volume Kubus</h2>
<p>Untuk mengisi kubus bersisi s dengan kubus satuan, tutup alasnya dulu: s lajur × s kubus = s² kubus. Lalu susun s lapisan: s × s² = s³.</p>
<div class="il"><svg viewBox="0 0 330 150" role="img"><g class="f"><polygon points="30,40 110,40 110,120 30,120"/><polygon points="30,40 60,15 140,15 110,40"/><polygon points="110,40 140,15 140,95 110,120"/></g><g class="s"><line x1="30" y1="40" x2="30" y2="120"/><line x1="30" y1="40" x2="110" y2="40"/><line x1="30" y1="40" x2="60" y2="15"/><line x1="50" y1="40" x2="50" y2="120"/><line x1="30" y1="60" x2="110" y2="60"/><line x1="50" y1="40" x2="80" y2="15"/><line x1="70" y1="40" x2="70" y2="120"/><line x1="30" y1="80" x2="110" y2="80"/><line x1="70" y1="40" x2="100" y2="15"/><line x1="90" y1="40" x2="90" y2="120"/><line x1="30" y1="100" x2="110" y2="100"/><line x1="90" y1="40" x2="120" y2="15"/><line x1="110" y1="40" x2="110" y2="120"/><line x1="30" y1="120" x2="110" y2="120"/><line x1="110" y1="40" x2="140" y2="15"/><line x1="30" y1="40" x2="60" y2="15"/><line x1="50" y1="40" x2="80" y2="15"/><line x1="70" y1="40" x2="100" y2="15"/><line x1="90" y1="40" x2="120" y2="15"/><line x1="110" y1="40" x2="140" y2="15"/><line x1="140" y1="15" x2="140" y2="95"/><line x1="110" y1="120" x2="140" y2="95"/></g><text x="55" y="136">s = 4 cm</text><text x="160" y="50">alas: 4 × 4 = 16 kubus satuan</text><text x="160" y="70">4 lapisan × 16 = 64 kubus</text><text x="160" y="90">V = s × s × s = 64 cm³</text></svg><small>Kubus bersisi 4 cm diisi kubus satuan 1 cm³</small></div>

<div class="sec"><h2>5️⃣ Volume Balok</h2>
<p>Pada balok, <b>panjang</b> adalah ukuran sisi alas yang lebih besar, <b>lebar</b> adalah ukuran sisi alas yang lain, dan <b>tinggi</b> adalah ukuran yang tegak lurus alas. Pada balok ABCD.EFGH, alasnya persegi panjang ABCD dan tingginya AE (atau BF, CG, DH).</p>

<div class="note">📌 <b>Modul 4, Kegiatan Belajar 2: Volume Prisma Tegak dan Silinder.</b></div>

<div class="sec"><h2>1️⃣ Mengenal Prisma</h2>
<p>Benda ruang yang punya dua permukaan paralel (sejajar) yang bentuk dan ukurannya sama disebut <b>prisma</b>. Permukaan paralelnya bisa berupa persegi panjang, segitiga, segilima, atau segienam. Permukaan seperti itu disebut <b>sisi</b> atau <b>alas</b>.</p>
<div class="tw"><table><tr><th>Bentuk alas</th><th>Nama prisma</th></tr>
<tr><td>Segitiga</td><td>Prisma segitiga</td></tr><tr><td>Persegi panjang</td><td>Prisma segi empat (balok)</td></tr><tr><td>Segilima</td><td>Prisma segilima</td></tr><tr><td>Segienam</td><td>Prisma segienam</td></tr></table></div>
<p>Kubus adalah salah satu tipe prisma. Volume prisma segi empat = panjang × lebar × tinggi, dan volume kubus = rusuk × rusuk × rusuk.</p>
<div class="ingat">🧠 <b>Ingat:</b> prisma = "dua alas kembar yang sejajar, ditumpuk setinggi h". Nama prisma ikut bentuk alasnya.</div></div>

<div class="sec"><h2>2️⃣ Contoh Menghitung Volume Prisma Segi Empat</h2>
<div class="tw"><table><tr><th>Prisma</th><th>Perhitungan</th></tr>
<tr><td>Kubus rusuk 5 cm</td><td>5 × 5 × 5 = 125 cm³</td></tr>
<tr><td>5,5 cm × 2,5 cm × 8 cm</td><td>110 cm³</td></tr>
<tr><td>8 cm × 4 cm × 6 cm</td><td>192 cm³</td></tr>
<tr><td>2 cm × 4 cm × 8 cm</td><td>64 cm³</td></tr>
<tr><td>10 cm × 2 cm × 3 cm</td><td>60 cm³</td></tr>
<tr><td>Gabungan dua prisma (bentuk L)</td><td>Dipecah jadi dua prisma: (3 × 3 × 2) + (4 × 3 × 8) = 114 cm³, dan dengan cara lain (7 × 2 × 3) + (6 × 4 × 3) = 114 cm³</td></tr></table></div>
<p>Pesan penting: bangun gabungan bisa dipecah dengan cara berbeda, hasilnya <b>tetap sama</b> (114 cm³).</p></div>

<div class="sec"><h2>3️⃣ Rumus Umum Volume Prisma</h2>
<p>Balok dapat dibayangkan sebagai <b>tumpukan kertas</b> berbentuk persegi panjang sampai setinggi t. Luas satu kertas = p × l, maka volume = luas alas × tinggi. Jika kertasnya berbentuk jajar genjang dan ditumpuk sampai tinggi h, hasilnya prisma beralas jajar genjang. Dengan luas alas A, volumenya A × h.</p>
<p><b>Teorema 3:</b> volume V prisma dengan luas alas A dan tinggi h adalah <b>V = A × h</b>.</p>
<div class="il"><svg viewBox="0 0 340 140" role="img"><g class="f"><polygon points="30,115 110,115 30,60"/><polygon points="30,60 70,35 70,90"/><polygon points="30,115 110,115 150,90 70,90 70,90"/></g><g class="s"><polygon points="30,115 110,115 30,60"/><polyline points="70,90 150,90 110,115"/><polyline points="70,90 70,35 30,60"/><line x1="70" y1="35" x2="150" y2="90"/></g><text x="55" y="132">alas segitiga</text><text x="170" y="50">V = luas alas × tinggi</text><text x="170" y="68">= (½ × 3 × 4) × 8</text><text x="170" y="86">= 6 × 8 = 48 cm³</text><text x="170" y="108">separuh dari balok 4 × 3 × 8 = 96 cm³</text></svg><small>Prisma segitiga adalah separuh balok</small></div>
<div class="tw"><table><tr><th>Contoh</th><th>Penyelesaian</th></tr>
<tr><td>Prisma segitiga siku-siku (3 cm, 4 cm), tinggi prisma 8 cm</td><td>Cara 1: A = ½ × 3 × 4 = 6 cm², V = 6 × 8 = 48 cm³. Cara 2: dua prisma membentuk balok 4 × 3 × 8 = 96 cm³, separuhnya 48 cm³</td></tr>
<tr><td>Prisma beralas luas 30 cm², tinggi 5 cm</td><td>V = 30 × 5 = 150 cm³</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> apa pun alasnya, <b>V = luas alas × tinggi</b>. Tinggi prisma adalah jarak antar alas, bukan tinggi segitiga pada alas.</div></div>

<div class="sec"><h2>4️⃣ Volume Silinder</h2>
<p>Prisma segiempat, segilima, dan segienam punya alas paralel dan sisi berbentuk persegi panjang. Silinder juga punya alas paralel (lingkaran), dan jaring-jaringnya juga memuat persegi panjang (selimut). Jadi silinder dapat dipandang sebagai prisma beralas lingkaran, sehingga rumus prisma berlaku.</p>
<p>Luas alas = π r², maka <b>V = π r² h</b>, dengan r jari-jari alas dan h tinggi silinder.</p>
<div class="il"><svg viewBox="0 0 340 150" role="img"><g class="f"><path d="M80,40 L80,115 A50,14 0 0 0 180,115 L180,40 Z"/></g><g class="s"><ellipse cx="130" cy="40" rx="50" ry="14"/><line x1="130" y1="40" x2="180" y2="40"/></g><circle class="p" cx="130" cy="40" r="3"/><text x="146" y="36">r</text><text x="190" y="82">tinggi h</text><text x="200" y="45">luas alas = π r²</text><text x="200" y="110">V = π r² × h</text><text x="60" y="145">silinder = prisma beralas lingkaran</text></svg><small>Silinder: luas alas lingkaran dikali tinggi</small></div>

<p>Benda sehari-hari berbentuk silinder: kaleng minuman, gelas, tangki minyak.</p>
<div class="ingat">🧠 <b>Ingat:</b> jari-jari <b>dikuadratkan</b> (r²), tinggi tidak. Jika diketahui diameter, bagi dua dulu.</div></div>

<tr><td>Balok 15 × 10 × 10</td><td>1.500 satuan volume</td></tr>

<div class="sec"><h2>1️⃣ Volume Limas</h2>
<p>Limas ada di sekitar kita: piramida Mesir, atap rumah, tenda pramuka. Silinder adalah bentuk khusus prisma dengan alas lingkaran. Dengan cara yang mirip, kita kenali volume limas lewat pembagian bangun yang sudah dikenal.</p>
<p><b>Dari kubus:</b> kubus dibagi dengan menghubungkan garis-garis tertentu sehingga diperoleh <b>tiga limas persegi</b> yang sama dan sebangun. Limas persegi adalah limas beralas persegi. Ketiganya mengisi kubus, jadi volume tiap limas adalah <b>satu per tiga</b> volume kubus.</p>

<p><b>Teorema 4:</b> volume V limas dengan luas alas A dan tinggi h adalah <b>V = ⅓ × A × h</b>.</p>

<div class="sec"><h2>2️⃣ Volume Kerucut</h2>
<p>Bayangkan alas limas berubah dari segi-4 beraturan menjadi segi-n beraturan dengan n makin besar. Alasnya makin mendekati lingkaran. Rumus limas ⅓ × luas alas × tinggi juga berlaku untuk kerucut. Alas kerucut tidak harus lingkaran, tetapi yang dibahas adalah alas lingkaran.</p>

const M4_KB4=`
<div class="note">📌 <b>Modul 4, Kegiatan Belajar 4: Volume Bola.</b></div>

<div class="sec"><h2>1️⃣ Prinsip Cavalieri</h2>
<p>Rumus volume bola diperoleh dengan cara berbeda dari bangun sebelumnya, yaitu memakai <b>Prinsip Cavalieri</b>.</p>
<p><b>Prinsip Cavalieri:</b> jika dua bangun ruang pejal terletak di antara dua bidang paralel, dan setiap irisan kedua bangun itu oleh bidang yang paralel dengan kedua bidang tadi mempunyai luas sama, maka volume kedua bangun ruang itu sama.</p>
<p>Contoh: dua silinder berjari-jari sama dan tinggi sama, yang satu tegak dan satu miring. Setiap irisan berupa lingkaran seluas πr², jadi volumenya sama. Prinsip ini menjelaskan mengapa volume prisma dan silinder hanya bergantung pada alas dan tingginya.</p>
<div class="ingat">🧠 <b>Ingat:</b> tumpukan koin yang lurus dan yang miring berisi koin sama banyak, jadi volumenya sama.</div></div>

<div class="sec"><h2>2️⃣ Menurunkan Volume Bola</h2>
<p>Dicari benda ruang yang luas irisannya sama dengan irisan bola. Dipakai benda pejal <b>S</b>: silinder berjari-jari alas r dan tinggi 2r yang dipotong dua kerucut (alas jari-jari r, tinggi r, puncaknya di tengah). Puncak kerucut dan pusat bola berada pada ketinggian sama.</p>
<div class="il"><svg viewBox="0 0 360 150" role="img"><circle class="f" cx="70" cy="70" r="50"/><line class="s d" x1="20" y1="70" x2="120" y2="70"/><circle class="p" cx="70" cy="70" r="3"/><text x="55" y="140">bola jari-jari r</text><rect class="s" x="200" y="20" width="100" height="100"/><polyline class="h" points="200,20 250,70 300,20"/><polyline class="h" points="200,120 250,70 300,120"/><text x="190" y="140">silinder (2r) − 2 kerucut = benda S</text><text x="128" y="45">irisan sama</text></svg><small>Prinsip Cavalieri: setiap irisan bola dan benda S luasnya sama (π(r² − a²))</small></div>
<p>Potong keduanya dengan bidang datar berjarak a dari pusat bola. Irisan benda S berupa cincin berjari-jari luar r dan dalam a, luasnya π(r² − a²). Irisan bola berupa lingkaran berjari-jari √(r² − a²), luasnya π(r² − a²). Luasnya sama untuk semua a, maka volume bola = volume benda S.</p>
<p>Volume S = volume silinder − 2 volume kerucut = πr²(2r) − 2(⅓ π r² · r) = 2πr³ − ⅔πr³ = <b>4/3 πr³</b>.</p>
<p><b>Teorema 6 (Volume bola):</b> <b>V = 4/3 π r³</b>.</p>
<div class="tw"><table><tr><th>Contoh</th><th>Penyelesaian</th></tr>
<tr><td>Dua bola berjari-jari r dan 2r</td><td>V₁ : V₂ = r³ : (2r)³ = 1 : 8</td></tr>
<tr><td>Bola jari-jari r dalam kerucut beralas jari-jari 2r, tinggi 3r</td><td>V kerucut = ⅓ π (2r)² 3r = 4πr³, V bola = 4/3 πr³, maka 3 : 1</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> V bola = 4/3 π r³ (r pangkat <b>tiga</b>). Jari-jari digandakan, volume menjadi <b>8 kali</b>.</div></div>

<div class="sec"><h2>3️⃣ Contoh Soal Latihan</h2>
<div class="tw"><table><tr><th>Soal</th><th>Jawaban</th></tr>
<tr><td>Bola tepat muat dalam kubus bersisi s (r = s/2). Berapa persen kotak yang kosong?</td><td>V bola = 4/3 π (s/2)³ = π s³/6. Kosong = (s³ − π s³/6) : s³ × 100% = (1 − π/6) × 100% ≈ 47,6%</td></tr>
<tr><td>Jari-jari bola menjadi dua kali</td><td>Volume menjadi 8 kali semula</td></tr>
<tr><td>Prisma miring dan silinder miring</td><td>Dibuktikan dengan Cavalieri: luas irisan horizontal sama dengan alas, jadi volume = luas alas × tinggi</td></tr></table></div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 4)</h2><div class="ujian"><p>
🔸 Jari-jari 1 : 2 maka volume 1 : 8. Jari-jari 2 : 3 maka volume 8 : 27. Volume 1 : 27 maka jari-jari 1 : 3.<br>
🔸 Bola dalam silinder (tinggi 2r, jari-jari r): volume bola = ⅔ volume silinder, ruang kosong ⅓ (kira-kira 33%).<br>
🔸 Silinder bola jari-jari sama dan tinggi 2r: volume bola : silinder = 2 : 3.<br>
🔸 Kerucut dan bola volume sama, jari-jari alas = jari-jari bola: tinggi kerucut 4r.<br>
🔸 Silinder (r, tinggi r) dalam bola jari-jari r: sisa bola dibandingkan volume bola = 1 : 4 (menurut kunci modul).<br>
🔸 Bola terbesar dalam silinder: jari-jari = jari-jari alas (silinder tinggi 15 dan volume 2.310: luas alas 154, r = 7, V bola ≈ 1.437,3 cm³).<br>
🔸 Bola dalam silinder tinggi 2r, volume bola : volume yang tidak terisi = 2 : 1 (soal "volume air yang tidak tumpah").</p></div></div>

<div class="sec"><h2>1️⃣ Gerak Lipat</h2>
<p>Lipat selembar kertas satu kali sesuka hati: terbentuk dua bangun yang dipisahkan lipatan. Belum tentu keduanya kongruen. Lalu ambil kertas persegi panjang ABCD, beri titik tengah P (pada AD) dan Q (pada BC), dan lipat menurut PQ. Dua bangun yang terbentuk <b>kongruen</b> (bentuk dan ukuran sama). Kegiatan inilah dasar konsep simetri lipat.</p>
<p>Proses melipat bangun menurut garis g disebut <b>gerak lipat</b>. Jika gerak lipat menghasilkan dua bangun kongruen, titik-titik yang bersesuaian saling berimpit (A dengan D, B dengan C, dan ruas AB dengan ruas DC).</p></div>

<div class="sec"><h2>2️⃣ Simetri Lipat dan Sumbu Simetri</h2>
<p>Bangun datar dikatakan <b>mempunyai simetri lipat</b> jika ada gerak lipat (menurut suatu garis) yang menghasilkan dua bangun kongruen. Garis lipat itu disebut <b>sumbu simetri</b>.</p>
<p><b>Banyaknya simetri lipat</b> = banyaknya gerak lipat yang menghasilkan dua bangun kongruen = <b>banyaknya sumbu simetri</b>.</p>

<div class="sec"><h2>3️⃣ Mengajarkan Simetri Lipat di SD</h2>
<p>Gunakan benda konkret: kertas atau karton berbentuk bangun datar. Contoh: untuk menunjukkan persegi ABCD punya empat simetri lipat, siswa melipatnya dengan empat cara berbeda sehingga selalu terbentuk dua bangun kongruen. Banyak cara melipat = banyak simetri lipat, dan bekas lipatannya adalah sumbu simetri.</p></div>

🔸 Tepat empat sumbu pada segi empat: <b>persegi</b>, bukan persegi panjang atau jajar genjang.<br>
🔸 Soal "semua anggota kelompok tidak punya simetri lipat": cari kelompok yang semua bangunnya tidak bisa dilipat jadi dua yang kongruen.<br>
🔸 Soal "banyak simetri lipat sama": semua anggota harus punya jumlah sumbu yang sama.<br>
🔸 Persegi, persegi panjang, segitiga sama sisi berturut-turut: 4, 2, 3.</p></div></div>

<div class="sec"><h2>1️⃣ Gerak Putar, Pusat Putar, Sudut Putar</h2>
<p>Bayangkan segitiga sama sisi dari karton putih dipaku di papan tulis, lalu diputar. Apakah ia bisa menempati tempat semulanya? Jika ya, berapa derajat putarannya? Demikian pula persegi yang dipaku di titik T (perpotongan diagonal AC dan BD): ada beberapa cara memutarnya agar kembali menempati tempat semula.</p>
<p>Proses memutar bangun ABCD hingga menempati EFGH disebut <b>gerak putar</b>. Titik T disebut <b>pusat putar</b> dan α disebut <b>sudut putar</b>. Pusat putar bisa di luar bidang yang diputar, atau pada bidang itu.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Pusat putar</th></tr>
<tr><td>Lingkaran</td><td>Pusat lingkaran</td></tr>
<tr><td>Persegi atau persegi panjang</td><td>Perpotongan kedua diagonal</td></tr>
<tr><td>Segitiga</td><td>Perpotongan garis-garis berat (titik berat)</td></tr></table></div>
<p>Titik yang tidak memenuhi ketentuan itu tidak disebut pusat putar. Jadi <b>pusat putar suatu bangun terletak pada titik beratnya</b>.</p>
<div class="ingat">🧠 <b>Ingat:</b> pusat putar = "titik tengah keseimbangan" bangun. Seperti baling-baling kincir: berputar di porosnya yang tepat di tengah.</div></div>

<div class="sec"><h2>2️⃣ Simetri Putar</h2>
<p>Bangun datar <b>mempunyai simetri putar</b> jika ada gerak putar yang membuat bangun menempati tempat semula. Pada persegi ABCD dengan pusat K: diputar 90° searah jarum jam, A menempati B, B menempati C, C menempati D, D menempati A. Diputar 180°, A menempati C dan B menempati D.</p>
<p>Setiap bangun datar <b>senantiasa</b> punya simetri putar, yaitu putaran <b>360°</b> yang disebut <b>gerak putar identitas</b>. Sudut putar α memenuhi 0° &lt; α ≤ 360°. Bangun yang hanya punya gerak putar identitas dikatakan mempunyai <b>tepat satu</b> simetri putar.</p>

<div class="sec"><h2>3️⃣ Simetri Putar dan Simetri Lipat</h2>
<p>Bangun bisa punya simetri putar tanpa simetri lipat, dan bangun bisa punya keduanya (misalnya persegi, segitiga sama sisi). Pernyataan "bangun yang punya simetri putar pasti punya simetri lipat" <b>salah</b>, begitu pula "pasti tidak punya simetri lipat". Setiap bangun punya simetri putar (minimal satu, yaitu 360°), bahkan yang tidak punya simetri lipat. Bangun yang tidak punya simetri putar tidak ada.</p>
<div class="ingat">🧠 <b>Ingat:</b> simetri putar minimal <b>1</b> (360°) untuk semua bangun. Simetri lipat bisa <b>0</b>.</div></div>

<div class="sec"><h2>4️⃣ Mengajarkan Simetri Putar di SD</h2>

🔸 Persegi panjang: 2 (180° dan 360°). Persegi: 4. Segitiga sama sisi: 3.<br>
🔸 Segi empat dengan tepat empat simetri putar: <b>persegi</b>.<br>
🔸 Bangun dengan "lebih dari satu simetri putar" memiliki 180° dan 360° atau lebih.<br>
🔸 Pusat putar pada titik berat, bukan sembarang titik.<br>
🔸 Tiga bangun: persegi panjang 2, persegi panjang lain 2, persegi 4 → "2, 2, dan 4".<br>

<div class="sec"><h2>1️⃣ Pengubinan</h2>
<p><b>Pengubinan</b> adalah proses menutup bidang datar (misalnya lantai) dengan ubin <b>tanpa celah dan tanpa tumpang tindih</b>. Biasanya ubinnya kongruen. Contoh pengubinan dalam modul:</p>
<div class="tw"><table><tr><th>No.</th><th>Ubin yang dipakai</th></tr>
<tr><td>1</td><td>Persegi panjang yang kongruen</td></tr><tr><td>2</td><td>Persegi yang kongruen</td></tr><tr><td>3</td><td>Segitiga sama kaki yang kongruen</td></tr><tr><td>4</td><td>Segitiga sama sisi yang kongruen</td></tr>
<tr><td>5</td><td>Segilima beraturan dan segitiga sama kaki (campuran)</td></tr><tr><td>6</td><td>Segi delapan beraturan dan persegi (campuran)</td></tr></table></div>
<p>Pengubinan <b>tidak harus</b> memakai bangun kongruen dan tidak harus satu macam bangun. Boleh bangun-bangun beraturan, boleh lebih dari satu macam.</p>
<h3>Menghitung banyak ubin</h3>
<p>Banyak ubin = luas lantai : luas satu ubin (samakan satuan dulu).</p>
<div class="tw"><table><tr><th>Soal</th><th>Penyelesaian</th></tr>
<tr><td>Lantai 8 m × 5 m, ubin persegi sisi 25 cm</td><td>(800 × 500) : (25 × 25) = 640 ubin</td></tr>
<tr><td>Harga satu ubin Rp3.500</td><td>640 × 3.500 = Rp2.240.000</td></tr>
<tr><td>Lantai 6 m × 4 m, ubin 50 cm × 25 cm</td><td>(600 × 400) : (50 × 25) = 192 ubin</td></tr>
<tr><td>Harga satu ubin Rp2.500</td><td>192 × 2.500 = Rp480.000</td></tr>
<tr><td>Lantai 5 m × 4 m, ubin sisi 25 cm (soal latihan)</td><td>(500 × 400) : 625 = 320 ubin</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> ubah meter ke sentimeter dulu (1 m = 100 cm), lalu bagi luas lantai dengan luas ubin.</div></div>

<div class="sec"><h2>2️⃣ Pencerminan</h2>
<p>Di depan cermin, bayangan kita punya bentuk dan ukuran sama (kongruen) dengan kita, dan <b>jarak benda ke cermin sama dengan jarak bayangan ke cermin</b>.</p>
<p>Cara menggambar bayangan bangun ABCD terhadap cermin: tarik garis dari A tegak lurus cermin, titik potongnya P. Ukur AP, tentukan A′ pada perpanjangan AP dengan PA′ = AP. Lakukan sama untuk B, C, D. Hubungkan A′B′, B′C′, C′D′, D′A′. Bangun A′B′C′D′ adalah <b>bayangan</b> ABCD dan kongruen dengannya.</p>
<div class="il"><svg viewBox="0 0 340 150" role="img"><g class="f"><polygon points="60,15 120,15 140,50 60,50"/><polygon points="60,125 120,125 140,90 60,90"/></g><line class="h" x1="30" y1="70" x2="170" y2="70"/><line class="s d" x1="60" y1="15" x2="60" y2="125"/><circle class="p" cx="60" cy="50" r="3"/><circle class="p" cx="60" cy="90" r="3"/><text x="44" y="14">A</text><text x="44" y="136">A′</text><text x="175" y="74">cermin (garis)</text><text x="190" y="40">jarak titik ke cermin</text><text x="190" y="56">= jarak bayangan ke cermin</text><text x="190" y="100">bayangan kongruen</text><text x="190" y="116">dengan bangun asli</text></svg><small>Pencerminan: bangun dan bayangannya kongruen</small></div>
<p>Pada persegi panjang ABCD dengan P, Q titik tengah AD dan BC: PQCD adalah bayangan PQBA terhadap garis PQ, dan sebaliknya. Jika cermin diletakkan pada garis RS (R, S titik tengah AB dan CD), RSDA adalah bayangan RSCB. Dua posisi cermin menghasilkan dua bangun kongruen.</p>
<h3>Hubungan dengan simetri lipat</h3>
<p>Sumbu lipat pada simetri lipat berperan sebagai cermin. Jadi <b>konsep simetri lipat sama dengan pencerminan</b>. Beberapa buku menyebut simetri lipat sebagai <b>simetri cermin</b>.</p>
<div class="tw"><table><tr><th>Bangun</th><th>Simetri cermin</th></tr>
<tr><td>Persegi</td><td>4</td></tr><tr><td>Persegi panjang</td><td>2</td></tr><tr><td>Segitiga sama sisi</td><td>3</td></tr><tr><td>Segitiga sama kaki</td><td>1</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> simetri cermin = simetri lipat. Jumlahnya sama persis.</div></div>

<div class="sec"><h2>3️⃣ Sistem Koordinat</h2>
<p><b>Permainan pengantar:</b> mata siswa ditutup sapu tangan, ia diberi petunjuk (melangkah tiga langkah ke kanan, belok kiri, dst.) untuk menemukan kue. Ini mengenalkan posisi atau koordinat.</p>
<p><b>Koordinat garis:</b> pada garis bilangan, bilangan yang dihubungkan dengan sebuah titik adalah koordinat titik itu (titik paling kiri berkoordinat 0, titik berikutnya 1, dan seterusnya).</p>
<p><b>Koordinat bidang:</b> dua garis bilangan, mendatar (<b>sumbu pertama</b>) dan tegak (<b>sumbu kedua</b>). Titik dinyatakan dengan pasangan terurut <b>(a, b)</b>: a menyatakan berapa satuan ke kanan dari 0, b berapa satuan ke atas dari 0.</p>

<p>Guru harus memulai dari <b>pengalaman keseharian siswa</b>. Siswa diminta mengukur panjang dan lebar kelas dengan satuan masing-masing (langkah, meter, depa). Dari sini siswa belajar bahwa satuan itu banyak macamnya: ada yang <b>baku</b> (meter) dan ada yang <b>tidak baku</b> (depa, langkah). Prinsip pengukuran adalah <b>proses pembandingan dengan satuan yang telah ditetapkan</b>, baku maupun tidak baku.</p>

<div class="sec"><h2>1️⃣ Satuan Luas</h2>

<div class="sec"><h2>2️⃣ Satuan Berat</h2>
<p>Satuan kilogram disingkat kg dan gram disingkat gr, <b>1 kg = 1.000 gr</b>. Satuan kg dipakai untuk benda besar (berat badan), gram untuk benda kecil (cincin, dosis obat). Untuk benda jauh lebih besar (truk, beras di gudang) dipakai kuintal atau ton. Contoh perkiraan: 1 bungkus mi instan sekitar 100 gram, setengah bungkus gula sekitar ½ kg.</p>

<div class="sec"><h2>3️⃣ Sistem Inggris dan Kesalahan yang Sering Terjadi</h2>
<p>Dalam sistem Inggris satuan berat adalah <b>ounce</b> (sering diterjemahkan "ons"). 1 ounce setara <b>28,349 gram</b>. 1 pound (lb) = 16 ounce. Satuan lain: grain dan ton Inggris.</p>

<p><b>Debit</b> menggambarkan seberapa deras aliran air atau lumpur dalam pipa. Contoh: semburan lumpur panas Porong, Sidoarjo, sekitar 120.000 m³/hari. Jika dialirkan ke bak mandi 1 m³: 1 hari = 24 jam = 24 × 3.600 = 86.400 detik, jadi 120.000 m³/hari ≈ <b>1,4 m³/detik</b>, dan bak penuh dalam sekitar 0,72 detik.</p>
<div class="il"><svg viewBox="0 0 340 130" role="img"><g class="s"><path d="M20,30 L70,30 L70,45"/><rect x="15" y="22" width="12" height="16"/></g><g class="p"><circle cx="70" cy="55" r="3"/><circle cx="70" cy="68" r="3"/><circle cx="70" cy="81" r="3"/></g><g class="f"><rect x="40" y="95" width="100" height="30"/></g><text x="160" y="55">debit = volume per satuan waktu</text><text x="160" y="75">contoh: liter/detik, cc/detik, m³/jam</text><text x="160" y="95">debit besar → mengalir lebih deras</text></svg><small>Debit: seberapa banyak cairan mengalir tiap satuan waktu</small></div>

<tr><td>Roket 36.000 km/jam ke planet terdekat berjarak 4 tahun cahaya</td><td>4 × 9,5 × 10¹² = 3,8 × 10¹³ km. Waktu = 3,8 × 10¹³ : 3,6 × 10⁴ ≈ 1,2 × 10⁹ jam. 1 tahun = 8,76 × 10³ jam, maka ±140.000 tahun</td></tr></table></div>
<div class="note">⚠️ Pada Contoh 7.1 modul tertulis "72 km/detik" padahal maksudnya 72 km/jam (hasil 20 m/detik cocok dengan km/jam). Begitu pula soal Tes Formatif 2 no. 9.</div>
<div class="ingat">🧠 <b>Ingat:</b> km/jam → m/detik: bagi 3,6. 72 km/jam = 20 m/detik, 36 km/jam = 10 m/detik.</div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 2)</h2><div class="ujian"><p>
🔸 Bukan satuan waktu: ounce, are, inch, gram/detik. Satuan waktu: windu, abad, tahun, menit.<br>
