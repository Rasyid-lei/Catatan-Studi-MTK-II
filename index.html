<div class="sec"><h2>🎯 Tujuan Modul 8</h2>
<p>Anda dapat menjelaskan cara menyelesaikan soal cerita tentang mata uang, pengiriman dan penyimpanan uang, menjelaskan bentuk-bentuk pengiriman dan penyimpanan uang, cara memakai wesel, tabungan, cek, saham, dan obligasi, merancang dan melaksanakan pembelajarannya di SD, dan mengevaluasi hasil belajar siswa. Pembelajaran sebaiknya melibatkan siswa secara aktif.</p></div>

<div class="sec"><h2>1️⃣ Dari Barter ke Mata Uang</h2>
<p>Sejak manusia mengenal alat tukar standar, <b>barter</b> (jual-beli dengan tukar-menukar barang) berangsur ditinggalkan. Alat tukar standar yang dipakai umum itu disebut <b>mata uang</b>. Sebelum mengenal uang, orang juga memakai alat tukar lain seperti emas.</p>
<div class="tw"><table><tr><th>Mata uang</th><th>Bangsa</th></tr>
<tr><td>Ringgit</td><td>Malaysia</td></tr><tr><td>Dolar</td><td>Amerika</td></tr><tr><td>Poundsterling</td><td>Inggris</td></tr><tr><td>Rupiah</td><td>Indonesia</td></tr></table></div>
<p>Tiap mata uang punya nilai dan besaran tertentu, misalnya Rp50.000, Rp1.000, Rp5.000. Mengenali nilainya membantu mengelompokkan uang. Contoh Rp1.375,00 dapat berupa: 1 lembar Rp1.000, 3 lembar Rp100, 1 keping Rp50, 1 keping Rp25.</p></div>

<div class="sec"><h2>2️⃣ Tiga Fungsi Uang</h2>
<div class="tw"><table><tr><th>Fungsi</th><th>Arti</th><th>Contoh</th></tr>
<tr><td>Satuan hitung (unit of account)</td><td>Menunjukkan nilai barang/jasa, kekayaan, dan besar pinjaman</td><td>Telur Rp7.500 per kg. Pinjaman Pak Amir Rp2.000.000</td></tr>
<tr><td>Alat tukar umum (medium of exchange)</td><td>Bertukar tanpa harus menukar barang dengan barang</td><td>Rp1.000 ditukar 1 roti. Rp10.000.000 ditukar 1 sepeda motor</td></tr>
<tr><td>Alat penyimpan kekayaan (store of value)</td><td>Memudahkan transaksi sekarang dan masa depan, uang segera dipakai membeli barang dan jasa atau membayar utang</td><td>Menabung</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> tiga fungsi uang: <b>Hitung, Tukar, Simpan</b>. Bahasa Inggrisnya: unit of account, medium of exchange, store of value.</div></div>

<div class="sec"><h2>3️⃣ Menghitung Nilai Kelompok Uang</h2>
<p>Contoh Ani: 2 lembar Rp10.000, 7 lembar Rp5.000, 8 lembar Rp1.000, 4 keping Rp100, 6 keping Rp50. Hitung: (2 × 10.000) + (7 × 5.000) + (8 × 1.000) + (4 × 100) + (6 × 50) = 20.000 + 35.000 + 8.000 + 400 + 300 = <b>Rp63.700</b>.</p>
<p><b>Cara mengajarkan:</b> demonstrasi dan pemberian tugas (latihan). Pengenalan konsep mata uang dan nilainya harus disertai demonstrasi mata uang secara langsung, supaya anak tidak asing dengan kondisi praktis di sekitar mereka.</p></div>

<div class="sec"><h2>4️⃣ Untung dan Rugi</h2>
<p><b>Untung (laba)</b>: harga jual lebih tinggi dari harga beli. <b>Rugi</b>: harga jual lebih rendah dari harga beli. Selisihnya yang menentukan. Jika tahu untung/rugi, bisa dicari harga beli. Jika tahu harga beli dan untung/rugi, bisa dicari harga jual.</p>
<div class="il"><svg viewBox="0 0 360 120" role="img"><g class="f"><rect x="20" y="40" width="100" height="40" rx="8"/><rect x="140" y="40" width="100" height="40" rx="8"/></g><rect class="p" x="260" y="40" width="80" height="40" rx="8" opacity=".6"/><text x="70" y="64" text-anchor="middle">harga beli</text><text x="190" y="64" text-anchor="middle">harga jual</text><text x="300" y="64" text-anchor="middle">untung</text><text x="20" y="105">untung = jual − beli (jual &gt; beli). Rugi = beli − jual (jual &lt; beli).</text><text x="20" y="25">% untung = untung : harga beli × 100%</text></svg><small>Untung dan rugi</small></div>
<p>Nilai untung atau rugi sering dinyatakan dalam persentase, yaitu perbandingan nilai untung atau rugi terhadap harga pembelian (atau penjualan) dikali 100%. Ada <b>persentase terhadap harga beli</b> dan <b>terhadap harga jual</b>.</p>
<div class="tw"><table><tr><th>Contoh</th><th>Penyelesaian</th></tr>
<tr><td>8.1 Tanah dibeli Rp4.500.000, dijual Rp6.000.000</td><td>Untung Rp1.500.000. Terhadap harga beli: 1.500.000 : 4.500.000 × 100% = 33,33%. Terhadap harga jual: 1.500.000 : 6.000.000 × 100% = 25%</td></tr>
<tr><td>8.2 Motor dibeli Rp2.750.000, untung 15%</td><td>Untung = 15% × 2.750.000 = Rp412.500. Harga jual = Rp3.162.500</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> tanya dulu "terhadap apa?" Kalau terhadap harga beli, pembaginya harga beli. Kalau terhadap harga jual, pembaginya harga jual.</div></div>

<div class="sec"><h2>5️⃣ Contoh Soal Latihan</h2>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 1)</h2><div class="ujian"><p>

<div class="note">📌 <b>Modul 8, Kegiatan Belajar 2: Bank dan Benda-Benda Pos.</b></div>

<div class="sec"><h2>1️⃣ Bentuk Pengiriman dan Penyimpanan Uang</h2>
<p>Uang berfungsi sebagai alat bayar, alat tukar, dan alat investasi (menyimpan modal). Untuk perdagangan antardaerah dicari sarana praktis. Pengiriman uang bisa lewat <b>pos</b> (wesel pos) atau lewat <b>bank</b> (transfer). Wesel pos lebih banyak dipakai karena mudah, dapat dipakai semua orang, dan menjangkau daerah terpencil (selama ada kantor pos). Transfer bank hanya untuk nasabah bank.</p>
<div class="il"><svg viewBox="0 0 360 110" role="img"><g class="f"><rect x="15" y="30" width="80" height="40" rx="8"/><rect x="140" y="30" width="80" height="40" rx="8"/><rect x="265" y="30" width="80" height="40" rx="8"/></g><line class="h" x1="97" y1="50" x2="138" y2="50"/><line class="h" x1="222" y1="50" x2="263" y2="50"/><text x="55" y="54" text-anchor="middle">nasabah</text><text x="180" y="54" text-anchor="middle">bank</text><text x="305" y="54" text-anchor="middle">peminjam</text><text x="118" y="42" text-anchor="middle">simpan</text><text x="243" y="42" text-anchor="middle">kredit</text><text x="15" y="95">bank menerima simpanan lalu menyalurkannya sebagai kredit</text></svg><small>Peran bank dalam penyimpanan uang</small></div>
<p>Dulu orang menyimpan uang di balik kasur atau bungkus bambu. Sekarang ada <b>bank</b>, lembaga keuangan yang menerima simpanan masyarakat (tabungan, deposito) dan menyalurkannya kembali dalam bentuk <b>kredit</b>. Sebagian orang memilih membeli surat berharga (saham, obligasi) untuk investasi.</p>
<div class="ingat">🧠 <b>Ingat:</b> alasan menyimpan di bank: <b>aman</b> (terhindar dari pencurian/kehilangan) dan <b>produktif</b> (bertambah karena bunga).</div></div>

<div class="sec"><h2>2️⃣ Wesel</h2>
<h3>Wesel pos</h3>
<p>Wesel pos adalah blangko yang dikeluarkan PN Postel untuk mengirim uang lewat pos. Bagian-bagiannya: (a) kolom pengirim, jumlah uang, dan tanggal pengiriman, (b) kolom alamat dan kolom uang, (c) kolom berita. Caranya mudah: datang ke kantor pos, isi kartu wesel, lalu kirimkan.</p>
<h3>Wesel (dagang)</h3>
<p>Wesel adalah <b>surat perintah membayar</b> dari seseorang yang mempunyai piutang kepada orang yang berutang kepadanya. Inisiatif dari penagih (pemilik piutang). Yang tercantum pada wesel:</p>
<div class="tw"><table><tr><th>No.</th><th>Isi</th></tr>
<tr><td>a</td><td>Kata "wesel" atau "surat wesel"</td></tr><tr><td>b</td><td>Perintah tidak bersyarat membayar sejumlah uang</td></tr><tr><td>c</td><td>Nama yang akan membayar</td></tr><tr><td>d</td><td>Penetapan hari pembayaran</td></tr><tr><td>e</td><td>Penetapan tempat pembayaran</td></tr><tr><td>f</td><td>Nama orang yang ditunjuk menerima pembayaran</td></tr><tr><td>g</td><td>Tanggal dan tempat pembuatan wesel</td></tr><tr><td>h</td><td>Tanda tangan pembuat</td></tr></table></div>
<div class="tw"><table><tr><th>Istilah</th><th>Arti</th></tr>
<tr><td>Personal wesel</td><td>Orang-orang yang tanda tangannya tertera pada wesel</td></tr>
<tr><td>Penarik</td><td>Orang yang membuat wesel atau perintah membayar (contoh Adya Barata)</td></tr>
<tr><td>Yang kena tarik</td><td>Orang yang diperintah membayar (contoh E. Noormartono)</td></tr></table></div>
<div class="tw"><table><tr><th>Jenis wesel</th><th>Ciri</th></tr>
<tr><td>Wesel berbunga</td><td>Bunga per tahun dicantumkan. Penarik menerima nilai nominal ditambah bunga</td></tr>
<tr><td>Wesel tidak berbunga</td><td>Penarik hanya menerima nilai nominal</td></tr></table></div>
<p>Fungsi wesel: <b>alat pembayar</b> (membeli barang dengan mengeluarkan wesel) dan <b>alat kredit</b> (meminjamkan uang dengan mengeluarkan atau menjaminkan wesel).</p></div>

<div class="sec"><h2>3️⃣ Tabungan</h2>
<p>Tabungan adalah simpanan bank yang penyetorannya bisa kapan saja. Tujuan menabung: mengumpulkan dana untuk masa depan, dan menyimpan uang untuk biaya hidup sehari-hari. Bunga diberikan agar dana berkembang dan nasabah makin rajin menabung. Bunga diberikan pada akhir bulan berdasarkan <b>saldo rata-rata harian</b>.</p>
<div class="tw"><table><tr><th>Bunga</th><th>Arti</th></tr>
<tr><td>Single rate</td><td>Berapa pun saldo, tingkat bunganya sama</td></tr>
<tr><td>Bertingkat</td><td>Semakin besar saldo, semakin tinggi bunga</td></tr></table></div>
<p><b>ATM</b> (Automatic Teller Machine) adalah pelayanan pembayaran kepada nasabah dengan mesin yang dikendalikan komputer. Nasabah memasukkan kartu ATM untuk menarik uang, bayar tagihan, transfer, dan beli pulsa. <b>Debit card</b> adalah kartu pengganti uang yang bekerja berdasarkan tabungan: memakainya berarti mengurangi tabungan sendiri. Berbeda dengan <b>kartu kredit</b>, yang merupakan bentuk <b>utang</b> terhadap bank.</p></div>

<div class="sec"><h2>4️⃣ Jasa Bank dalam Negeri</h2>
<div class="tw"><table><tr><th>Jasa</th><th>Arti</th></tr>
<tr><td>Pengiriman uang (transfer)</td><td>Bank melaksanakan amanat nasabah mengirim uang kepada pihak lain di tempat lain</td></tr>
<tr><td>Inkaso (collection)</td><td>Pemberian kuasa kepada bank untuk menagih atau meminta persetujuan pembayaran (akseptasi), misalnya menagih wesel atau cek luar negeri lewat bank devisa dalam negeri</td></tr>
<tr><td>Letter of credit dalam negeri (L/C.DN)</td><td>Jasa bank memperlancar pengadaan barang antarpulau di dalam negeri. Penjual terjamin pembayarannya jika pembeli memenuhi syarat</td></tr>
<tr><td>Delegasi kredit (bankir order)</td><td>Kuasa kepada bank membayar sejumlah uang secara berkala selama jangka waktu tertentu. Dana dari rekening giro atau tabungan biasa</td></tr></table></div></div>

<div class="sec"><h2>5️⃣ Deposito</h2>
<p>Deposito adalah simpanan pihak ketiga kepada bank yang penarikannya hanya bisa pada <b>jangka waktu tertentu</b> menurut perjanjian. Penyimpannya disebut <b>deposan</b>, bukti kepemilikannya selembar kertas bernama <b>bilyet</b>. Jangka waktu: 1, 3, 6, 12, atau 24 bulan. Saat jatuh tempo, deposan dapat menarik atau memperpanjang.</p>
<div class="tw"><table><tr><th>Macam deposito</th><th>Ciri</th></tr>
<tr><td>Deposito valuta asing berjangka</td><td>Simpanan dalam mata uang asing (dolar AS dll.). Jangka 1, 3, 6, 12 bulan</td></tr>
<tr><td>Deposito on call</td><td>Simpanan yang tetap di bank selama deposan belum membutuhkannya. Penarikan harus diberitahukan dulu (misalnya 1 atau 2 bulan sebelumnya)</td></tr>
<tr><td>Deposito Automatic Roll-Over (ARO)</td><td>Saat jatuh tempo, otomatis diperpanjang dan terus berbunga, uang tidak menganggur</td></tr></table></div>
<div class="note">⚠️ Soal Tes Formatif 2 no. 3 menulis "Automatic Roll-Call", padahal teks modul menulis Roll-Over. Di catatan dipakai Roll-Over.</div>
<div class="ingat">🧠 <b>Ingat:</b> deposito = diambil <b>pada waktunya</b> (jatuh tempo). Tabungan = diambil <b>kapan saja</b>. Buktinya: bilyet.</div></div>

<div class="sec"><h2>6️⃣ Giro dan Rekening Koran</h2>
<p>Giro adalah rekening yang uangnya dapat diambil <b>setiap hari</b>, dengan fasilitas pembayaran <b>cek dan giro bilyet</b>. Nasabah membuka <b>rekening koran</b> sebagai sarana penyimpanan uang, dan masing-masing punya nomor rekening. Untuk mengambil uang, bank memberi <b>buku cek</b>.</p></div>

<div class="sec"><h2>7️⃣ Cek</h2>
<p>Cek adalah <b>surat perintah membayar</b> sejumlah uang dari nasabah kepada bank tempat ia menyimpan uang. Cek berfungsi sebagai alat pembayaran sah seperti uang, tetapi uang tidak boleh ditolak sedangkan cek boleh ditolak jika penerima ragu. Cek harus memuat:</p>
<div class="tw"><table><tr><th>No.</th><th>Isi cek</th></tr>
<tr><td>1</td><td>Nama bank</td></tr><tr><td>2</td><td>Nomor rekening nasabah</td></tr><tr><td>3</td><td>Tempat dan tanggal pembuatan cek</td></tr><tr><td>4</td><td>Tanda tangan yang memberi perintah</td></tr><tr><td>5</td><td>Perintah membayar sejumlah uang</td></tr><tr><td>6</td><td>Cap nasabah (jika ada, perusahaan instansi)</td></tr></table></div>
<div class="tw"><table><tr><th>Macam cek</th><th>Ciri</th></tr>
<tr><td>Cek pembawa</td><td>Tidak menyebut nama penerima, dibayar kepada siapa pun yang membawa</td></tr>
<tr><td>Cek atas nama</td><td>Hanya dibayar kepada orang yang namanya tercantum</td></tr>
<tr><td>Cek perjalanan</td><td>Dipakai saat bepergian, bisa ditukar di bank mana saja atau dibayarkan ke hotel, restoran, toko. Untuk mengamankan uang di perjalanan</td></tr>
<tr><td>Cek bersilang</td><td>Dua garis sejajar di muka cek, hanya dapat dibayar kepada bank (tidak dapat ditunaikan). Silang umum: tanpa nama bank. Silang khusus: ada nama bank</td></tr></table></div>
<p><b>Cek kosong</b> adalah cek yang dikeluarkan tanpa simpanan di bank. <b>Cek mundur</b> adalah cek yang tanggalnya ditulis mundur (tanggal jatuh tempo), sehingga baru bisa dicairkan pada tanggal itu. Masa berlaku cek sejak tanggal pada cek sampai batas <b>70 hari</b>.</p></div>

<div class="sec"><h2>8️⃣ Saham</h2>
<p>Surat saham (surat sero) adalah tanda bukti menanamkan uang dalam suatu perusahaan. Pemegangnya ikut memodali perusahaan dan mendapat bagian laba yang disebut <b>dividen</b>, diterima pada waktu-waktu tertentu. Contoh dalam modul: PT Bank Mandiri membagikan dividen tunai tahun buku 2006 sebesar 60% dari laba bersih, Rp70,02 per lembar saham.</p>
<div class="tw"><table><tr><th>Bentuk saham</th><th>Ciri</th></tr>
<tr><td>Atas nama</td><td>Mencantumkan nama pemegang saham. Tidak dapat diperjualbelikan</td></tr>
<tr><td>Pembawa (terbuka)</td><td>Tanpa nama pemegang saham</td></tr>
<tr><td>Biasa</td><td>Dividen tergantung naik-turunnya keuntungan perusahaan, jadi tidak tetap</td></tr>
<tr><td>Istimewa</td><td>Mempunyai hak-hak istimewa</td></tr></table></div>
<p>Lembaran saham ada dua bagian: <b>lembar induk (mantel)</b>, bagian muka luar berisi pernyataan perusahaan sebagai bukti kepemilikan, dan <b>lembar belakang (talon, lembar dividen)</b>, alat mendapatkan hak laba.</p>
<div class="tw"><table><tr><th>Nilai saham</th><th>Kurs</th><th>Contoh (nominal Rp10.000)</th></tr>
<tr><td>Nominal (tercantum di lembaran)</td><td>—</td><td>—</td></tr>
<tr><td>Nilai jual sama dengan nominal (pari)</td><td>100</td><td>Rp10.000</td></tr>
<tr><td>Di bawah nominal</td><td>di bawah 100</td><td>Kurs 97: 97% × 10.000 = Rp9.700</td></tr>
<tr><td>Di atas nominal</td><td>di atas 100</td><td>Kurs 102: 102% × 10.000 = Rp10.200</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> saham = ikut punya perusahaan (balas jasa: <b>dividen</b>). Obligasi = meminjamkan uang (balas jasa: <b>kupon</b>).</div></div>

<div class="sec"><h2>9️⃣ Obligasi</h2>
<p>Perusahaan atau pemerintah yang butuh uang besar dapat meminjam. Pinjaman yang harus dikembalikan <b>sebelum satu tahun</b> adalah <b>jangka pendek</b>, dan yang dikembalikan <b>lebih dari satu tahun</b> adalah <b>jangka panjang</b>. Surat pinjaman itu disebut <b>obligasi</b>.</p>
<p>Obligasi adalah surat tanda bukti meminjam sejumlah uang kepada umum, dengan hasil bunga tetap untuk jangka waktu tertentu, dikeluarkan perusahaan atau negara. Hakikatnya surat pengakuan meminjam uang.</p>
<div class="tw"><table><tr><th>Menurut jaminan</th><th>Arti</th></tr>
<tr><td>Atas dasar jaminan (agunan)</td><td>Dijamin dengan benda-benda tetap, keyakinan umum lebih kuat</td></tr>
<tr><td>Tanpa jaminan</td><td>Berdasarkan kepercayaan belaka</td></tr></table></div>
<p>Pemegang obligasi mendapat bunga tetap yang disebut <b>kupon</b>, dan tanggal pembayarannya disebut <b>hari kupon</b>. Kupon terdiri dari: (a) bunga tetap/obligasi biasa (kupon tetap, dihitung sekian persen dari nilai nominal) dan (b) bunga berubah (dasar bunga berubah dari satu masa kupon ke masa kupon berikutnya, terus meningkat).</p></div>

<div class="sec"><h2>🔟 Contoh Soal Latihan</h2>
<div class="tw"><table><tr><th>Soal</th><th>Jawaban</th></tr>
<tr><td>Deposito on call</td><td>Simpanan (deposito) yang tetap berada di bank selama deposan tidak membutuhkannya</td></tr>
<tr><td>Bagian-bagian cek</td><td>Nama bank, nomor rekening nasabah, tempat dan tanggal pembuatan, tanda tangan pemberi perintah</td></tr>
<tr><td>Saham nominal Rp20.000 kurs 90%</td><td>90% × 20.000 = Rp18.000</td></tr>
<tr><td>Kupon</td><td>Bunga dari obligasi</td></tr>
<tr><td>Obligasi atas dasar jaminan</td><td>Obligasi yang dijamin dengan benda-benda tetap</td></tr></table></div></div>

<div class="sec"><h2>🚨 Sering Keluar di Ujian (KB 2)</h2><div class="ujian"><p>
🔸 Pengiriman uang lewat pos: <b>wesel pos</b>. Lewat bank: transfer. Cek adalah surat perintah membayar.<br>
🔸 Bukti memiliki deposito: <b>bilyet</b> (bukan giro, kupon, atau rekening koran).<br>
🔸 Deposito otomatis diperpanjang: Automatic Roll-Over (ARO).<br>
🔸 Cek yang dipakai orang bepergian: <b>cek perjalanan</b>. Cek tanpa dana: <b>cek kosong</b>. Cek bertanggal mundur: cek mundur.<br>
🔸 Saham yang mencantumkan nama pemegangnya: saham <b>atas nama</b>.<br>
🔸 Debit card memotong tabungan sendiri, kartu kredit adalah utang.<br>
🔸 Dividen untuk saham, kupon untuk obligasi.<br>
🔸 Obligasi di bawah satu tahun: jangka pendek. Di atas satu tahun: jangka panjang.<br>
🔸 Kurs jual 97 → di bawah pari, nilai jual 97% × nominal.<br>
🔸 Masa berlaku cek sampai 70 hari sejak tanggal pada cek.<br>
🔸 Wesel: penarik (yang membuat), yang kena tarik (yang diperintah).</p></div></div>

<div class="sec"><h2>2️⃣ Data Statistik</h2>

<p><b>Salah konsep:</b> anggapan bahwa <b>semua data berbentuk bilangan</b>. Data kualitatif tidak berbentuk bilangan. Dalam keputusan sehari-hari, data berbentuk bilangan lebih mudah dipahami dan membantu mengambil keputusan (misalnya risiko hujan 10% menentukan perlu payung atau tidak).</p>

<div class="sec"><h2>3️⃣ Mengumpulkan Data</h2>
<p>Siswa SD dapat diajak mengumpulkan data dari lingkungan sekitar rumah. <b>Kegiatan 1:</b> siswa mencatat data dari media massa (televisi, radio, koran, majalah), mengelompokkan menurut jenis (kuantitatif atau kualitatif), dan mencatat <b>sumber data</b>. Ingatkan siswa bahwa data harus <b>data sebenarnya</b>, tidak boleh hasil mereka-reka.</p>
<div class="tw"><table><tr><th>Cara mengumpulkan data</th><th>Arti</th></tr>

<p>Data juga dapat diperoleh dari <b>percobaan (eksperimen)</b>, misalnya pelemparan mata uang (muncul gambar atau angka) atau pelemparan dadu.</p></div>

<div class="sec"><h2>4️⃣ Ukuran Pemusatan: Rata-Rata, Modus, Median</h2>
<p>Untuk gambaran lebih jelas tentang sekumpulan data diperlukan ukuran wakil data. <b>Rata-rata</b> dan <b>modus</b> disebut ukuran <b>gejala pusat</b>, sedangkan <b>median</b> disebut ukuran <b>letak</b>.</p>
<h3>Rata-rata (rerata)</h3>
<p>Arti: jika semua nilai dikumpulkan lalu dibagi rata ke setiap data. Contoh "warga Kalimasada rata-rata punya dua ekor ayam" tidak berarti tiap warga punya dua ayam. <b>Kegiatan 1:</b> 5 siswa membawa kelereng 6, 4, 8, 9, 3; kumpulkan lalu bagi rata, masing-masing 6 kelereng, maka rata-rata = 6.</p>
<p><b>Rata-rata = jumlah nilai data : banyak data.</b></p>
<div class="tw"><table><tr><th>Contoh</th><th>Hasil</th></tr>
<tr><td>Nilai ujian 70, 69, 45, 80, 56</td><td>Jumlah 320, banyak data 5, rata-rata 64</td></tr>
<tr><td>Arisan 12 keluarga bawa beras 10, 3, 7, 5, 8, 9, 6, 4, 8, 4, 4, 9 kg</td><td>Jumlah 77 : 12 = 6,42 kg</td></tr></table></div>
<div class="note">⚠️ Pada Contoh 1, hasil penjumlahan di modul terbaca "270" pada hasil pindai, padahal 70 + 69 + 45 + 80 + 56 = 320, sehingga rata-ratanya 64.</div>
<h3>Modus</h3>
<p>Nilai yang <b>paling banyak muncul</b>. <b>Kegiatan:</b> melempar dadu 10 kali, mencatat hasil, lalu siswa menentukan nilai yang paling sering muncul. Bisa ada <b>dua modus atau lebih</b>. Jika tiap nilai muncul sama banyak, data <b>tidak mempunyai modus</b>.</p>
<div class="tw"><table><tr><th>Contoh</th><th>Hasil</th></tr>
<tr><td>70, 65, 80, 65, 65, 65, 50, 65, 55, 70</td><td>Modus 65</td></tr>
<tr><td>1, 3, 5, 4, 6, 7, 2, 10 (tiap nilai satu kali)</td><td>Tidak punya modus</td></tr>
<tr><td>10, 10, 15, 15, 6, 6, 7, 7, 8, 8, 4, 4 (tiap nilai dua kali)</td><td>Tidak punya modus</td></tr></table></div>
<h3>Median</h3>
<p>Nilai <b>tengah</b> setelah data diurutkan. Jika banyak data <b>ganjil</b>: nilai yang di tengah. Jika <b>genap</b>: rata-rata dua nilai tengah. Cara mudah: urutkan, lalu coret dari kiri dan kanan dengan jumlah coretan sama. Jika ada satu nilai tak tercoret, itulah median. Jika dua nilai tercoret terakhir, median adalah rata-ratanya.</p>
<div class="tw"><table><tr><th>Contoh</th><th>Hasil</th></tr>
<tr><td>12: 4, 6, 2, 9, 7, 0, 4, 7, 4, 6, 1. Urut: 0, 1, 2, 4, 4, 4, 6, 6, 7, 7, 9</td><td>Median 4 (tengah, tak tercoret)</td></tr>
<tr><td>13: 70, 80, 60, 75, 60, 95, 70, 85, 90, 90. Urut: 60, 60, 70, 70, 75, 80, 85, 90, 90, 95</td><td>Dua tengah 75 dan 80, median 77,5</td></tr></table></div>
<h3>Bahan diskusi penerapan</h3>
<div class="tw"><table><tr><th>Keperluan</th><th>Ukuran</th></tr>
<tr><td>Ranking siswa di kelas</td><td>Rata-rata</td></tr><tr><td>Ketua perkumpulan (suara terbanyak)</td><td>Modus</td></tr><tr><td>Rumah tempat pertemuan (kedekatan ke semua anggota)</td><td>Median</td></tr><tr><td>Juara tinju</td><td>Modus</td></tr></table></div>
<div class="ingat">🧠 <b>Ingat:</b> <b>R</b>ata = <b>R</b>ata-ratakan (jumlah : banyak). <b>M</b>odus = <b>M</b>uncul paling sering. <b>M</b>edian = <b>M</b>ed (tengah) setelah diurutkan.</div></div>

{f:"",q:"Jari-jari bola dan alas silinder 2 m. Jika tinggi silinder 2 m, perbandingan volume bola dan volume silinder adalah ....",o:["2 : 1", "4 : 3", "3 : 2", "1 : 1"],a:1,e:"Kunci di modul: B (4 : 3)."},

]},"m4-tf2":{title:"Modul 4 · Tes Formatif 2 (KB 2)",qs:[
{f:"",q:"Sebuah balok berukuran panjang 8 cm, lebar 6 cm, dan tinggi 5 cm maka volumenya adalah ... cm³.",o:["240", "250", "260", "230"],a:0,e:"V = 8 × 6 × 5 = 240 cm³."},
{f:"",q:"Sebuah prisma segi empat beralas jajar genjang dengan sisi 5 cm dan 4 cm, tinggi prisma 10 cm, volume 100 cm³. Tinggi jajar genjang adalah ....",o:["1 cm", "2 cm", "3 cm", "4 cm"],a:1,e:"Luas alas = 100 : 10 = 10 cm². Luas jajar genjang = alas × tinggi = 5 × t = 10, maka t = 2 cm."},
{f:"",q:"Suatu kolam renang panjang 125 m dan lebar 100 m. Untuk mengisi sampai penuh dibutuhkan air 125.000 m³. Kedalaman kolam adalah ....",o:["20 m", "25 m", "10 m", "5 m"],a:2,e:"t = 125.000 : (125 × 100) = 10 m."},
{f:"",q:"Dua silinder beralas lingkaran dengan jari-jari 3r dan 2r. Jika tinggi kedua silinder sama maka perbandingan volumenya adalah ....",o:["6 : 8", "9 : 4", "8 : 9", "10 : 12"],a:1,e:"V₁ : V₂ = π(3r)²t : π(2r)²t = 9 : 4."},
{f:"Gambar: prisma beralas trapesium (sisi sejajar 9 cm dan 3 cm, tinggi trapesium 5 cm), tinggi prisma 15 cm.",q:"Volume bangun ruang berikut adalah ... cm³.",o:["400", "350", "450", "300"],a:2,e:"Alas prisma berbentuk trapesium: V = [½ × (9 + 3) × 5] × 15 = 450 cm³."},
{f:"Gambar: silinder dengan luas alas 30 cm² dan tinggi 10 cm (sesuai pembahasan kunci).",q:"Volume silinder berikut ini adalah ... cm³.",o:["200", "250", "300", "350"],a:2,e:"V = luas alas × tinggi = 30 × 10 = 300 cm³."},
{f:"",q:"Jika volume prisma segienam berikut 300 cm³ dan luas alasnya 75 cm², maka tinggi prisma tersebut adalah ... cm.",o:["7", "4", "5", "6"],a:1,e:"t = 300 : 75 = 4 cm."},
{f:"",q:"Prisma segitiga beralas segitiga siku-siku, tinggi prisma 10 cm, volume 270 cm³. Jika sisi siku-siku segitiga berperbandingan 2 : 3, panjang sisi-sisi tersebut berturut-turut adalah ....",o:["6 cm, 9 cm", "4 cm, 6 cm", "8 cm, 10 cm", "10 cm, 14 cm"],a:0,e:"Luas alas = 270 : 10 = 27, maka s₁ × s₂ = 54. Yang berperbandingan 2 : 3 adalah 6 dan 9."},
{f:"",q:"Dua silinder beralas lingkaran berperbandingan volume 2 : 3. Jika jari-jari kedua silinder sama, perbandingan tinggi kedua silinder adalah ....",o:["2 : 3", "4 : 9", "8 : 27", "1 : 3"],a:0,e:"Luas alas sama, maka V₁ : V₂ = t₁ : t₂ = 2 : 3."},
{f:"Gambar: prisma segitiga dengan alas segitiga bersisi alas 8 dan tinggi prisma 15.",q:"Volume prisma berikut 300 satuan volume. Tinggi segitiga pada alas prisma tersebut adalah ....",o:["3", "5", "6", "4"],a:1,e:"Luas alas = 300 : 15 = 20. Alas segitiga bersisi alas 8, maka ½ × 8 × t = 20, sehingga t = 5."}
]},"m4-tf1":{title:"Modul 4 · Tes Formatif 1 (KB 1)",qs:[
{f:"",q:"Jika ukuran sisi dari kubus A adalah dua kali ukuran sisi dari kubus B maka volume kubus A ....",o:["dua kali volume kubus B", "empat kali volume kubus B", "delapan kali volume kubus B", "setengah dari volume kubus B"],a:2,e:"V = s³, maka VA = (2s)³ = 8 VB."},
{f:"",q:"Dua botol A dan B penuh berisi air. Semua air dituangkan bergantian ke dalam ember yang sama. Tinggi air dari botol A 20 cm dan dari botol B 2 dm. Volume botol A ....",o:["sama dengan volume botol B", "lebih dari volume botol B", "kurang dari volume botol B", "kurang dari atau sama dengan volume botol B"],a:0,e:"Embernya sama, alasnya sama, tinggi 20 cm = 2 dm, jadi volumenya sama."},
{f:"",q:"1 liter didefinisikan sebagai volume dari kubus satuan yang ukuran sisinya adalah ....",o:["1 m", "1 dm", "1 cm", "10 dm"],a:1,e:"1 liter = 1 dm³."},
{f:"",q:"Air dari bak penampungan berkapasitas 270 liter dialirkan merata ke 10 rumah, tiap rumah memakai bak berbentuk kubus. Pernyataan yang benar, kecuali ....",o:["volume dari setiap bak air adalah 27 dm³", "volume dari setiap bak air itu adalah 27.000 mililiter", "ukuran sisi dari bak air itu adalah 0,03 m", "ukuran sisi dari bak air itu adalah 30 cm"],a:2,e:"Tiap rumah 27 L = 27 dm³ = 27.000 mL. Sisi = 3 dm = 30 cm = 0,3 m, jadi 0,03 m salah."},
{f:"",q:"Untuk membuat kotak berbentuk kubus dengan volume 216 mililiter maka sisinya berukuran ....",o:["6 cm", "6 dm", "0,6 m", "0,6 dam"],a:0,e:"216 mL = 216 cm³, maka sisi = 6 cm."},
{f:"",q:"Pak Bonar membeli pasir 13,5 m³ yang disimpan merata dalam 4 bak berbentuk kubus. Pernyataan berikut benar, kecuali ....",o:["volume dari bak tersebut adalah 3,375 m³", "volume dari bak tersebut adalah 3375 liter", "ukuran sisi dari bak tersebut adalah 15 dm", "ukuran sisi dari bak tersebut kurang dari 15 dm dan lebih dari 14 dm"],a:3,e:"Volume tiap bak 3,375 m³ = 3375 L, sisi tepat 15 dm, bukan kurang dari 15 dm."},
{f:"",q:"Jika luas satu permukaan suatu kubus adalah 81 cm² maka kubus tersebut ....",o:["volumenya 729 cm³", "volumenya 6561 cm³", "volumenya 6,561 m³", "ukuran sisinya lebih dari 10 cm"],a:0,e:"s² = 81, s = 9 cm, V = 729 cm³."},
{f:"",q:"Jika volume kubus A adalah seper delapan dari volume kubus B maka ukuran sisi kubus A ... kali ukuran sisi kubus B.",o:["setengah", "dua", "seper delapan", "delapan"],a:0,e:"sA³ = ⅛ sB³, maka sA = ½ sB."},
{f:"",q:"Jika ukuran sisi kubus A tiga kali ukuran sisi kubus B maka volume kubus A ... kali volume kubus B.",o:["3", "27", "1/3", "1/27"],a:1,e:"VA = (3sB)³ = 27 VB."},
{f:"",q:"Jika jumlah panjang 3 rusuk kubus A adalah 12 cm maka volume kubus A adalah ....",o:["1728 mililiter", "64 liter", "17,28 liter", "64 mililiter"],a:3,e:"3sA = 12, sA = 4 cm, V = 64 cm³ = 64 mL."},
{f:"",q:"Volume dari balok yang panjangnya 8 cm, lebar 6 cm, dan tinggi 10 cm adalah ....",o:["24 cm³", "480 cm³", "48 dm³", "4,8 liter"],a:1,e:"V = 8 × 6 × 10 = 480 cm³."},
{f:"",q:"Volume dari balok yang panjangnya 6 cm, lebar 5 cm, dan tinggi 2 dm adalah ....",o:["60 cm³", "60 dm³", "600 cm³", "600 dm³"],a:2,e:"Tinggi 2 dm = 20 cm, V = 6 × 5 × 20 = 600 cm³."},
{f:"",q:"Panjang balok A 2 kali panjang balok B, lebar balok A ½ kali lebar balok B, tinggi balok A ½ kali tinggi balok B. Volume balok A adalah ....",o:["dua kali volume balok B", "setengah dari volume balok B", "sama dengan volume balok B", "tiga kali volume balok B"],a:1,e:"VA = 2 × ½ × ½ VB = ½ VB."},
{f:"",q:"Volume suatu balok adalah 340 liter dan luas alasnya 40 dm², maka tinggi balok adalah ....",o:["60 cm", "0,6 dm", "6 m", "1/6 dm"],a:2,e:"Kunci di modul: C. Dasarnya V = luas alas × tinggi, namun angka pada soal dan pembahasan kunci tidak cocok, jadi cek di buku."},
{f:"",q:"Jika volume balok A dua kali volume balok B, dan tinggi serta lebar kedua balok sama, maka ....",o:["panjang balok A adalah dua kali panjang balok B", "panjang balok A adalah setengah dari panjang balok B", "luas alas balok A adalah setengah luas alas balok B", "luas balok A adalah tiga kali panjang balok B"],a:0,e:"Tinggi dan lebar sama, jadi panjang A dua kali panjang B."},
{f:"",q:"Pak Anton membuat bak air berbentuk balok dengan p : l : t = 3 : 2 : 1. Jika lebar bak 4 dm maka volume bak air adalah ....",o:["24 dm³", "64 dm³", "384 dm³", "48 dm³"],a:3,e:"l = 4 berarti p = 6 dan t = 2, V = 6 × 4 × 2 = 48 dm³."},

{f:"",q:"Luas alas balok A dua kali luas alas balok B, dan volume balok A setengah kali volume balok B. Maka ....",o:["tinggi balok A dua kali tinggi balok B", "tinggi balok A setengah dari tinggi balok B", "tinggi balok A seperempat dari tinggi balok B", "tinggi kedua balok sama"],a:2,e:"V = luas alas × tinggi: 2LB × tA = ½ LB × tB, maka tA = ¼ tB."},
{f:"",q:"Volume balok A delapan kali volume balok B. Jika kedua balok adalah kubus maka panjang rusuk balok A adalah ....",o:["dua kali lebar balok B", "delapan kali panjang balok B", "setengah dari panjang balok B", "empat kali lebar balok A"],a:0,e:"sA³ = 8 sB³ = (2sB)³, maka sA = 2sB."},
{f:"",q:"Balok mempunyai volume 12 kali volume kubus. Panjang : lebar : tinggi balok tersebut adalah ....",o:["6 : 2 : 4", "1 : 2 : 1", "6 : 3 : 3", "3 : 2 : 2"],a:3,e:"Perbandingan yang hasil kalinya 12 adalah 3 × 2 × 2."}
]},

const app=document.getElementById("app");
const L=["A","B","C","D"];
function menu(){
 app.innerHTML='<div class="grid">'+MODS.map((m,i)=>`<a class="mc" href="#modul-${i+1}"><b>Modul ${i+1}</b><h3>${m[0]} ${m[1]}</h3><small>${m[2]}</small></a>`).join("")+'</div>';
}
function quiz(id){
 const t=TF[id];let sc=0,done=0;
 const box=document.createElement("div");
 box.innerHTML=`<div class="score">${t.title} · Skor <span id="s-${id}">0</span> / ${t.qs.length} · Terjawab <span id="d-${id}">0</span></div>`+
 t.qs.map((q,i)=>`<div class="q" data-i="${i}"><b>${i+1})</b> ${q.q}${q.f?`<div class="fig">🖼️ ${q.f}</div>`:""}${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${L[j]}. ${o}</button>`).join("")}<div class="exp" hidden></div></div>`).join("");
 box.querySelectorAll(".q").forEach(qe=>{
  const q=t.qs[qe.dataset.i];let locked=false;
  qe.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(locked)return;locked=true;done++;
   const j=+b.dataset.j;
   if(j===q.a){sc++;b.classList.add("ok")}else{b.classList.add("bad");qe.querySelectorAll(".opt")[q.a].classList.add("ok")}
   const ex=qe.querySelector(".exp");ex.hidden=false;ex.textContent="✅ Kunci: "+L[q.a]+". "+q.e;
   box.querySelector("#s-"+id).textContent=sc;box.querySelector("#d-"+id).textContent=done;
  });
 });
 return box;
}
function modul(n){
 const m=MODS[n-1];
 app.innerHTML=`<a class="back" href="#">← Semua modul</a><h2>${m[0]} Modul ${n}: ${m[1]}</h2>`;
 const soon=t=>()=>{const d=document.createElement("div");d.className="sec";d.textContent="🚧 "+t+" belum masuk. Akan dikerjakan setelah Anda bilang \"lanjut\".";return d};
 const H=x=>()=>{const d=document.createElement("div");d.innerHTML=x;return d};
 const MD={
  1:[["Materi KB 1",H(M1_MATERI)],["Materi KB 2",H(M1_KB2)],["Tes Formatif 1",()=>quiz("m1-tf1")],["Tes Formatif 2",()=>quiz("m1-tf2")]],
  9:[["Materi KB 1",H(M9_KB1)],["Materi KB 2",H(M9_KB2)],["Tes Formatif 1",()=>quiz("m9-tf1")],["Tes Formatif 2",()=>quiz("m9-tf2")]],
  8:[["Materi KB 1",H(M8_KB1)],["Materi KB 2",H(M8_KB2)],["Tes Formatif 1",()=>quiz("m8-tf1")],["Tes Formatif 2",()=>quiz("m8-tf2")]],
  7:[["Materi KB 1",H(M7_KB1)],["Materi KB 2",H(M7_KB2)],["Tes Formatif 1",()=>quiz("m7-tf1")],["Tes Formatif 2",()=>quiz("m7-tf2")]],
  6:[["Materi KB 1",H(M6_KB1)],["Materi KB 2",H(M6_KB2)],["Tes Formatif 1",()=>quiz("m6-tf1")],["Tes Formatif 2",()=>quiz("m6-tf2")]],
  5:[["Materi KB 1",H(M5_KB1)],["Materi KB 2",H(M5_KB2)],["Materi KB 3",H(M5_KB3)],["Tes Formatif 1",()=>quiz("m5-tf1")],["Tes Formatif 2",()=>quiz("m5-tf2")],["Tes Formatif 3",()=>quiz("m5-tf3")]],
  4:[["Materi KB 1",H(M4_KB1)],["Materi KB 2",H(M4_KB2)],["Materi KB 3",H(M4_KB3)],["Materi KB 4",H(M4_KB4)],["Tes Formatif 1",()=>quiz("m4-tf1")],["Tes Formatif 2",()=>quiz("m4-tf2")],["Tes Formatif 3",()=>quiz("m4-tf3")],["Tes Formatif 4",()=>quiz("m4-tf4")]],
  3:[["Materi KB 1",H(M3_KB1)],["Materi KB 2",H(M3_KB2)],["Tes Formatif 1",()=>quiz("m3-tf1")],["Tes Formatif 2",()=>quiz("m3-tf2")]],
  2:[["Materi KB 1",H(M2_KB1)],["Materi KB 2",H(M2_KB2)],["Tes Formatif 1",()=>quiz("m2-tf1")],["Tes Formatif 2",()=>quiz("m2-tf2")]]
 };
 if(!MD[n]){app.insertAdjacentHTML("beforeend",'<div class="sec">🚧 Modul ini belum dikerjakan. Akan diisi bertahap setiap kali Anda bilang "lanjut".</div>');return}
 const bar=document.createElement("div");bar.className="tabs";
 const body=document.createElement("div");
 app.append(bar,body);
 function show(k){
  [...bar.children].forEach((b,i)=>b.classList.toggle("on",i===k));
  body.innerHTML="";body.append(MD[n][k][1]());
 }
 MD[n].forEach((t,i)=>{const b=document.createElement("button");b.className="tab";b.textContent=t[0];b.onclick=()=>show(i);bar.append(b)});
 show(0);
}
function route(){
 const m=/^#modul-(\d+)$/.exec(location.hash);
 if(m&&+m[1]>=1&&+m[1]<=9)modul(+m[1]);else menu();
 window.scrollTo(0,0);
}
addEventListener("hashchange",route);route();
const th=document.getElementById("theme");
th.onclick=()=>{const d=document.documentElement.dataset.theme==="dark";document.documentElement.dataset.theme=d?"light":"dark";th.textContent=d?"🌙 Gelap":"☀️ Terang"};
</script>
